<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programación II · Unidad III: TAD y estructuras lineales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF6;--surface:#FFFFFF;--surface-2:#F5F6FB;--line:#D6D9E8;--line-strong:#B9BDD6;
  --text:#1D1F33;--muted:#585C7D;--accent:#4F5B93;--accent-ink:#FFFFFF;--accent-soft:#E2E5F4;
  --amber:#8F5600;--amber-soft:#FBEFD9;--coral:#B83B30;--coral-soft:#FBE3E0;--mint:#17734F;--mint-soft:#DDF2E8;
  --code-bg:#F7F8FC;--code-gutter:#A2A6C0;--code-hl:#E9ECF8;
  --t-kw:#6A3DB8;--t-var:#B3332A;--t-str:#7F5300;--t-num:#9A4F00;--t-fn:#0A6A94;--t-cls:#136B4C;--t-com:#7D819C;--t-this:#C0306A;
  --term-bg:#1C1D2B;--term-text:#E7E7F1;--term-muted:#8C8FB0;
  --shadow:0 1px 0 rgba(30,32,60,.04),0 18px 40px -24px rgba(30,32,60,.45);
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171824;--surface:#202233;--surface-2:#282B40;--line:#34374F;--line-strong:#4A4E6E;
    --text:#ECEBF5;--muted:#A4A6C2;--accent:#A3ACE6;--accent-ink:#171824;--accent-soft:#2E3252;
    --amber:#F2BE5C;--amber-soft:#3A3122;--coral:#F3877A;--coral-soft:#3D2629;--mint:#72D3A8;--mint-soft:#1F3A30;
    --code-bg:#1B1D2C;--code-gutter:#5B5F80;--code-hl:#2A2E48;
    --t-kw:#C0A9FF;--t-var:#FF9389;--t-str:#EBC777;--t-num:#F7B26A;--t-fn:#86D0F2;--t-cls:#8EDDB6;--t-com:#7C7FA0;--t-this:#FF8FC0;
    --term-bg:#11121C;--shadow:0 1px 0 rgba(0,0,0,.2),0 24px 48px -28px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171824;--surface:#202233;--surface-2:#282B40;--line:#34374F;--line-strong:#4A4E6E;
  --text:#ECEBF5;--muted:#A4A6C2;--accent:#A3ACE6;--accent-ink:#171824;--accent-soft:#2E3252;
  --amber:#F2BE5C;--amber-soft:#3A3122;--coral:#F3877A;--coral-soft:#3D2629;--mint:#72D3A8;--mint-soft:#1F3A30;
  --code-bg:#1B1D2C;--code-gutter:#5B5F80;--code-hl:#2A2E48;
  --t-kw:#C0A9FF;--t-var:#FF9389;--t-str:#EBC777;--t-num:#F7B26A;--t-fn:#86D0F2;--t-cls:#8EDDB6;--t-com:#7C7FA0;--t-this:#FF8FC0;
  --term-bg:#11121C;--shadow:0 1px 0 rgba(0,0,0,.2),0 24px 48px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--mono);font-size:.9em}
.app{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;overflow:hidden}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding:10px clamp(10px,2.4vw,24px);border-bottom:1px solid var(--line);background:var(--surface)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:background .2s,border-color .2s}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.iconbtn svg{width:20px;height:20px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:0 1 auto}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elephant{width:38px;height:24px;flex:none}
.modname{margin-left:auto;margin-right:auto;font-weight:600;color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.right{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.modname+.right{margin-left:0}
.score{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--text);font-weight:600;font-size:.88rem;border:0}
.score svg{width:16px;height:16px;color:var(--accent)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.theme-ico .moon{display:none}
:root[data-theme="dark"] .theme-ico .sun{display:none}
:root[data-theme="dark"] .theme-ico .moon{display:block}

/* ---------- Stage / frame ---------- */
.stage{position:relative;overflow:hidden;padding:clamp(8px,2vw,22px);min-height:0}
.frame{position:relative;height:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;border-bottom:1px solid var(--line);background:var(--surface-2);flex:none}
.tab{display:inline-flex;align-items:center;gap:8px;height:100%;padding:0 12px;font-family:var(--mono);font-size:.8rem;color:var(--text);background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;top:1px}
.tab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.crumb{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-wrap{position:relative;flex:1;min-height:0}
.slide{position:absolute;inset:0;overflow:auto;padding:clamp(18px,3.6vw,46px) clamp(16px,4vw,56px) clamp(24px,3.6vw,46px);scrollbar-gutter:stable}
.slide.enter{animation:slideIn .42s cubic-bezier(.2,.8,.2,1) both}
.slide.leave{animation:slideOut .22s ease both;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*36px))}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(calc(var(--dir,1)*-24px))}}
.rv{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stitle{font-size:clamp(1.55rem,3.1vw,2.5rem);line-height:1.12;letter-spacing:-.02em;font-weight:700;margin:0 0 .5em;max-width:28ch}
.stitle .brace,.cbrace{font-family:var(--mono);font-weight:400;color:var(--accent);opacity:.7}
.stitle .brace{margin-left:.35em}
.cbrace{font-size:clamp(1.4rem,2.6vw,2rem);margin-top:22px;line-height:1}
.lead{font-size:clamp(1.02rem,1.5vw,1.22rem);max-width:68ch;margin:0 0 1.1em;color:var(--text)}
.lead b,.pts b,.card b{font-weight:650}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:.85em;padding:0 .45em;border-radius:6px;background:var(--accent-soft);color:var(--text)}
.pts{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:10px;max-width:72ch}
.pts li{position:relative;padding-left:22px}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.pts li b{color:var(--text)}
.ptitle{font-size:.95rem;font-weight:700;margin:1.2em 0 .6em;color:var(--muted)}
.analogy{display:flex;gap:14px;align-items:flex-start;max-width:72ch;margin:1.2em 0 0;padding:16px 18px;border-radius:12px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.analogy svg{flex:none;width:24px;height:24px;color:var(--amber);margin-top:2px}
.analogy p{margin:0}
.analogy strong{display:block;font-size:.85rem;color:var(--amber);margin-bottom:2px}
.note{max-width:76ch;margin:1.2em 0 0;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:0 0 1em}
.group{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.group h3{margin:0 0 6px;font-size:1.1rem}
.group p{margin:0}
.group .pts{margin:8px 0 0}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,220px)),1fr));gap:14px;margin:0 0 .5em}
.card{position:relative;padding:18px 18px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left}
.card h3{margin:0 0 6px;font-size:1.08rem;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted)}
.card ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.card .ex{margin-top:12px;font-family:var(--mono);font-size:.78rem;padding:8px 10px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line);overflow-x:auto;white-space:pre}
.cards.flow{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}
.cards.flow .card::after{content:"";position:absolute;right:-26px;top:50%;width:18px;height:18px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.cards.flow .card:last-child::after{display:none}
.cards.flow .card h3{color:var(--accent)}
@media (max-width:720px){.cards.flow{grid-template-columns:1fr;gap:30px}.cards.flow .card::after{right:50%;top:auto;bottom:-24px;transform:translateX(50%) rotate(135deg)}}
.flip{perspective:900px;padding:0;border:0;background:none;min-height:190px}
.flip-in{position:relative;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.face h3{margin:0 0 6px;font-size:1.15rem}
.face p{margin:0;color:var(--muted)}
.face.back p{color:var(--text)}
.face small{margin-top:auto;color:var(--accent);font-weight:600;font-size:.8rem}

/* steps */
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;counter-reset:st}
.steps>li{counter-increment:st;position:relative;padding:54px 16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.steps>li::before{content:counter(st);position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.9rem}
.steps h3{margin:0 0 4px;font-size:1.02rem}
.steps p{margin:0;color:var(--muted);font-size:.95rem}
.steps ul{margin:8px 0 0;padding-left:18px;font-size:.92rem}

/* tables */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:0 0 1em}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);font-weight:700}
tbody th{font-weight:700;color:var(--accent);white-space:nowrap;background:var(--surface-2);width:1%}
tbody tr:last-child>*{border-bottom:0}
td code{background:var(--code-bg);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}

/* cover */
.cover{min-height:100%;display:grid;align-content:center;gap:10px;max-width:900px}
.cover .unit{font-family:var(--mono);color:var(--accent);font-size:.95rem}
.cover h1{font-size:clamp(2.4rem,7vw,5.2rem);line-height:.98;letter-spacing:-.035em;margin:0;font-weight:700}
.cover h1 .brace{font-family:var(--mono);font-weight:400;color:var(--accent);font-size:.6em;vertical-align:.15em;margin-left:.15em}
.cover .sub{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--muted);max-width:52ch;margin:6px 0 10px}
.topics{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:8px 0 0;list-style:none}
.topics button{border:1px solid var(--line);background:var(--surface-2);padding:8px 14px;border-radius:999px;font-size:.92rem;transition:border-color .2s,background .2s}
.topics button:hover{border-color:var(--accent);background:var(--accent-soft)}
.cover .start{justify-self:start;margin-top:18px}

/* buttons / controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ctrls{display:grid;gap:12px;margin:0 0 14px}
.ctrl{display:grid;gap:5px;font-size:.88rem;color:var(--muted);font-weight:500}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select{height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:.9rem;width:100%}
.ctrl input:focus,.ctrl select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl output{font-family:var(--mono);color:var(--text);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-family:var(--mono);font-size:.82rem;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--text)}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .2s;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* code */
.code-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.code-layout{grid-template-columns:minmax(0,1fr)}}
.code{position:relative;margin:0;font-family:var(--mono);font-size:clamp(.74rem,1.02vw,.86rem);line-height:1.65;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:14px 0;counter-reset:l;tab-size:4}
.code.flash{animation:flash .6s ease}
@keyframes flash{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 0 transparent}}
.ln{display:block;padding:0 18px 0 0;white-space:pre;min-height:1.65em}
.ln::before{counter-increment:l;content:counter(l);display:inline-block;width:2.4em;margin-right:1.1em;text-align:right;color:var(--code-gutter);user-select:none}
.ln.hl{background:var(--code-hl)}
.ln.click{cursor:pointer;transition:background .15s}
.ln.click:hover{background:var(--code-hl)}
.ln.bad{background:var(--coral-soft)}
.ln.good{background:var(--mint-soft)}
.t-kw{color:var(--t-kw);font-weight:600}.t-var{color:var(--t-var)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-fn{color:var(--t-fn)}.t-cls{color:var(--t-cls)}.t-com{color:var(--t-com);font-style:italic}.t-this{color:var(--t-this);font-weight:600}.t-tag{color:var(--t-kw)}
.side{display:grid;gap:14px}
.term{background:var(--term-bg);color:var(--term-text);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:.84rem;border:1px solid #2c2e44}
.term-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #2c2e44;color:var(--term-muted);font-size:.78rem}
.term-h .p{color:#A3ACE6}
.term-out{margin:0;padding:14px;min-height:96px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.term-out .e{color:#FF8E82}.term-out .w{color:#F2C15F}.term-out .ok{color:#7FDDB2}.term-out .dim{color:var(--term-muted)}
.caret{display:inline-block;width:8px;height:1.05em;background:#A3ACE6;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.extra{margin-top:4px}

/* quiz */
.quiz{max-width:780px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--muted);font-size:.9rem}
.qdots{display:flex;gap:6px}
.qdots i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.qdots i.cur{background:var(--accent)}
.qdots i.ok{background:var(--mint)}
.qdots i.ko{background:var(--coral)}
.qtext{font-size:clamp(1.1rem,1.8vw,1.35rem);font-weight:600;line-height:1.35;margin:0 0 16px;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(3px)}
.opt .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:.85rem}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.right .k{background:var(--mint);color:#fff;border-color:var(--mint)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);animation:shake .4s}
.opt.wrong .k{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.why{margin:14px 0 0;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);animation:rise .35s both}
.why b{display:block;margin-bottom:2px}
.why.ok b{color:var(--mint)}.why.ko b{color:var(--coral)}
.qnav{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.result{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:560px){.result{grid-template-columns:1fr;justify-items:start}}
.ring{width:132px;height:132px}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--sans);font-weight:700;fill:var(--text)}
.result h3{margin:0 0 4px;font-size:1.4rem}

/* footer */
.foot{display:flex;align-items:center;gap:12px;padding:10px clamp(10px,2.4vw,24px);border-top:1px solid var(--line);background:var(--surface)}

<script>
/* ============ Utilidades para los ejemplos ============ */
const P = String.raw;
const clean = (s, d='') => { const r = String(s ?? '').replace(/["'\\$`{}<>]/g, '').trim().slice(0, 40); return r || d; };
const ident = (s, d) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(String(s).trim()) ? String(s).trim() : d;
const pn = x => { if (!isFinite(x)) return x > 0 ? 'INF' : 'NAN'; return Number.isInteger(x) ? String(x) : String(parseFloat(x.toPrecision(14))); };
const nums = s => String(s).split(',').map(t => t.trim()).filter(t => t !== '' && !isNaN(Number(t))).map(Number);
const ints = s => nums(s).filter(Number.isInteger);
const r2 = x => Math.round(x * 100) / 100;
const FE = (cls, msg) => `Fatal error: Uncaught ${cls}: ${msg}`;

/* ============ Contenido ============ */
const lst = s => String(s).split(',').map(x => clean(x)).filter(Boolean).slice(0, 8);
const MODULES = [
/* ---------------------------------------------------------------- 1 */
{ title:'Estructuras de datos y TAD', unit:'Unidad III', part:'Parte I', slides:[
 {type:'cover', title:'Estructuras de datos', file:'estructuras.php', sub:'Cómo guardamos y ordenamos la información dentro de un programa.', topics:['¿Qué es una estructura de datos?','Lineales y no lineales','De tamaño fijo o variable','Tipos de datos','¿Qué es un TAD?']},
 {type:'concept', title:'¿Qué es una estructura de datos?', file:'estructura.php',
  lead:'Es una <b>forma de guardar y ordenar datos</b> dentro de un programa, para después encontrarlos y usarlos fácil.',
  points:[['Guarda','muchos datos juntos.'],['Los ordena','de una manera determinada.'],['Según cómo los ordene,','algunas tareas son rápidas y otras lentas.']],
  analogy:'Pensá en tu ropero. Si las medias están en un cajón y las remeras en un estante, encontrás todo rápido. Si tirás todo en una montaña, la ropa es la misma, pero buscar una media te lleva mucho más. <b>Los datos son la ropa; la estructura es cómo la acomodás.</b>'},
 {type:'code', title:'Mismos datos, distinto orden', file:'agenda.php',
  lead:'Guardamos los mismos tres contactos de dos maneras. Elegí a quién buscar y tocá «Ejecutar». En la <b>lista</b> hay que mirar uno por uno. En la <b>agenda por nombre</b> vamos directo.',

    $pasos++;

echo "Agenda: " . $agenda["${v.q}"] . " (1 paso)";`,

 {type:'code', title:'Ejemplo: una cuenta de banco', file:'CuentaBancaria.php',
  lead:'La regla es: <b>el saldo nunca puede quedar negativo</b>. Probá sacar más plata de la que hay, o cambiar el saldo a mano.',
  controls:[{k:'acc',label:'¿Qué hacemos?',type:'seg',options:['sacar plata','cambiar el saldo a mano'],value:'sacar plata'},{k:'m',label:'Plata a sacar',type:'range',min:0,max:2000,value:300}],
  code:v=>P`<?php
class CuentaBancaria {
    private float $saldo = 0;    // privado: no se toca desde afuera

    public function depositar(float $monto): void {
        $this->saldo += $monto;
    }

    public function sacar(float $monto): void {
        if ($monto > $this->saldo) {
            throw new Exception("No alcanza la plata");
        }
        $this->saldo -= $monto;
    }

    public function verSaldo(): float {
        return $this->saldo;
    }
}

$cuenta = new CuentaBancaria();
$cuenta->depositar(1000);
${v.acc==='sacar plata'?`$cuenta->sacar(${v.m});`:'$cuenta->saldo = -500;     // intento hacer trampa'}
echo "Saldo: " . $cuenta->verSaldo();`,
  run:v=>v.acc!=='sacar plata'?FE('Error','Cannot access private property CuentaBancaria::$saldo'):(+v.m>1000?FE('Exception','No alcanza la plata'):'Saldo: '+(1000-v.m)),
  after:v=>`<div class="note">${v.acc==='sacar plata'?'Si pedís más de 1000, la cuenta <b>se niega</b> y muestra un error. Así la regla siempre se cumple.':'Como <code>$saldo</code> es <code>private</code>, PHP no deja cambiarlo desde afuera. La única forma es usar <code>depositar()</code> o <code>sacar()</code>.'}</div>`},

 {type:'code', title:'La pila en PHP', file:'Pila.php',
  lead:'Una pila hecha con un <code>array</code>. Cambiá los valores y elegí qué hacer después. Probá desapilar más veces de las que apilaste.',
  controls:[{k:'vals',label:'Valores a apilar',type:'text',value:'10, 20, 30'},{k:'acc',label:'Después',type:'seg',options:['desapilar 1 vez','desapilar 4 veces'],value:'desapilar 1 vez'}],
  code:v=>P`<?php
class Pila {
    private array $datos = [];

    public function apilar($dato): void {
        $this->datos[] = $dato;           // lo pone al final (arriba)
    }

    public function desapilar() {
        if (count($this->datos) === 0) {
            throw new Exception("La pila está vacía");
        }
        return array_pop($this->datos);   // saca el último (el de arriba)
    }
}

$pila = new Pila();
foreach ([${nums(v.vals).join(', ')}] as $v) {
    $pila->apilar($v);
}
${v.acc==='desapilar 1 vez'?'echo $pila->desapilar();':'for ($i = 0; $i < 4; $i++) {\n    echo $pila->desapilar() . "\\n";\n}'}`,
  run:v=>{ const st=nums(v.vals), out=[], n=v.acc==='desapilar 1 vez'?1:4;
    for(let i=0;i<n;i++){ if(!st.length){ out.push(FE('Exception','La pila está vacía')); break; } out.push(pn(st.pop())); }
    return out.join('\n'); }},

 {type:'code', title:'Una pila para dar vuelta palabras', file:'invertir.php',
  lead:'Si apilamos las letras de una palabra y después las desapilamos, salen al revés. Así podemos saber si una palabra se lee igual al derecho y al revés. Probá con <i>neuquen</i> o con tu nombre.',
  controls:[{k:'w',label:'Palabra',type:'text',value:'neuquen'}],
  code:v=>P`<?php
$palabra = "${clean(v.w,'neuquen')}";
$pila = new SplStack();

foreach (mb_str_split($palabra) as $letra) {
    $pila->push($letra);           // apilo cada letra
}

$alReves = "";
while (!$pila->isEmpty()) {
    $alReves .= $pila->pop();      // desapilo: salen al revés
}

echo "$palabra al revés es $alReves\n";
echo $palabra === $alReves ? "¡Se lee igual!" : "No se lee igual";`,

<script>

const SLIDES = [];
MODULES.forEach((m, mi) => m.slides.forEach((s, si) => { s.mi = mi; s.si = si; s.idx = SLIDES.length; if (s.type === 'quiz') s.qid = `m${mi}-${si}`; SLIDES.push(s); }));

/* ---------- Resaltado de sintaxis PHP ---------- */
const KW = new Set('abstract and array as break callable case catch class clone const continue declare default do echo else elseif empty extends final finally fn for foreach function global if implements include instanceof insteadof interface isset list match namespace new or print private protected public readonly require return static switch throw trait try unset use var while yield true false null void int float string bool mixed iterable object self parent never'.split(' '));
function hl(code) {
  const re = /(<\?php)|(\/\/[^\n]*|#(?!\[)[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\$[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); const t = m[0];
    if (m[1]) out += `<span class="t-tag">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="t-str">${esc(t).replace(/\$[A-Za-z_]\w*/g, v => `<span class="t-var">${v}</span>`)}</span>`;
    else if (m[4]) out += `<span class="${t === '$this' ? 't-this' : 't-var'}">${t}</span>`;

      if (before === '->' || before === '?>') out += call ? `<span class="t-fn">${t}</span>` : esc(t);
      else if (KW.has(t.toLowerCase()) && !(call && !['function','fn','array','isset','unset','empty','match','list','echo','print','declare','if','foreach','for','while','switch','catch'].includes(t))) out += `<span class="t-kw">${t}</span>`;
      else if (call) out += `<span class="t-fn">${t}</span>`;
      else if (/^[A-Z]/.test(t)) out += `<span class="t-cls">${t}</span>`;
      else out += esc(t);
    }
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const codeLines = code => hl(code).split('\n').map((l, i) => `<span class="ln" data-l="${i}">${l || ' '}</span>`).join('');

/* ---------- Íconos ---------- */
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>',
};

/* ---------- Bloques reutilizables ---------- */
const title = s => `<h2 class="stitle rv">${s.title}<span class="brace">{</span></h2>`;

function extras(s, d) { let h = '';

  if (s.points) h += `<div class="rv" style="--d:${d++}">${s.ptitle ? `<div class="ptitle">${s.ptitle}</div>` : ''}${ptsHTML(s.points)}</div>`;

/* ---------- Renderizadores ---------- */
const R = {
  cover(s) {

      <h1 class="rv" style="--d:1">${s.title}<span class="brace">{ }</span></h1>

  },
  concept(s) { const [x, d] = extras(s, 2); return title(s) + lead(s) + x + close(d); },
  cards(s) {

      : `<div class="card rv" style="--d:${i + 2}"><h3>${c.t}</h3>${c.d ? `<p>${c.d}</p>` : ''}${c.list ? `<ul>${c.list.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}${c.ex ? `<div class="ex">${hl(c.ex)}</div>` : ''}</div>`).join('');
    const [x, d] = extras(s, s.cards.length + 2);

  },

  },

  },
  code(s) {

      <div class="side">${s.controls ? `<div class="ctrls">${s.controls.map(ctrlHTML).join('')}</div>` : ''}

  quiz(s) { return title(s) + `<div class="quiz rv" style="--d:1"></div>`; },
  end(s) { return title(s) + `<p class="lead rv" style="--d:1">Terminaste la Unidad III: estructuras de datos, TADs, pilas, colas y listas. Este es tu resultado en los cuestionarios.</p><div class="final rv" style="--d:2"></div>` + close(3); },
};

function ctrlHTML(c) {
  const id = 'c_' + c.k;

}

/* ---------- Terminal con efecto de tipeo ---------- */
function colorize(text) {
  return text.split('\n').map(l => { const e = esc(l);
    if (/^(PHP )?Fatal error/.test(l)) return `<span class="e">${e}</span>`;
    if (/^(Warning|Deprecated|Notice)/.test(l)) return `<span class="w">${e}</span>`;
    return e; }).join('\n');
}
async function typeOut(el, text) {
  const tk = ++el._tk || (el._tk = 1);
  el.innerHTML = '<span class="caret"></span>';
  if (!RM.matches) { await sleep(180); let i = 0; const step = Math.max(1, Math.ceil(text.length / 70));
    while (i < text.length) { if (el._tk !== tk) return; i += step; el.innerHTML = esc(text.slice(0, i)) + '<span class="caret"></span>'; await sleep(14); } }
  if (el._tk === tk) el.innerHTML = colorize(text) + '\n<span class="dim">— fin de la ejecución —</span>';
}

/* ---------- Hidratación ---------- */
const H = {
  cover(el, s) {
    $$('[data-topic]', el).forEach(b => b.onclick = () => {
      const t = b.dataset.topic.toLowerCase().replace(/[¿?]/g, '');
      const words = t.split(/[\s,]+/).filter(w => w.length > 3);
      const target = SLIDES.find(x => x.mi === s.mi && x.idx > s.idx && x.title === b.dataset.topic) || SLIDES.find(x => x.mi === s.mi && x.idx > s.idx && x.type !== 'quiz' && words.some(w => x.title.toLowerCase().includes(w)));
      go(target ? target.idx : s.idx + 1);
    });
  },
  cards(el) { $$('.flip', el).forEach(f => f.onclick = () => { f.classList.toggle('on'); f.setAttribute('aria-pressed', f.classList.contains('on')); }); },
  code(el, s) {
    const v = {}; (s.controls || []).forEach(c => v[c.k] = c.value);
    const pre = $('.code', el), out = $('.term-out', el), ex = $('.extra', el); let ran = false;
    const paint = (flash) => { pre.innerHTML = codeLines(typeof s.code === 'function' ? s.code(v) : s.code);
      if (flash) { pre.classList.remove('flash'); void pre.offsetWidth; pre.classList.add('flash'); }

      v[i.dataset.k] = i.type === 'checkbox' ? i.checked : (i.type === 'range' || i.type === 'number') ? (i.value === '' ? 0 : +i.value) : i.value;
      const o = i.parentElement.querySelector('output'); if (o) o.textContent = i.value; changed(); }));
    $$('.seg button', el).forEach(b => b.onclick = () => { $$(`.seg button[data-k="${b.dataset.k}"]`, el).forEach(x => x.setAttribute('aria-pressed', x === b)); v[b.dataset.k] = b.dataset.v; changed(); });
  },

  quiz(el, s) { runQuiz($('.quiz', el), s); },
  end(el) {
    const box = $('.final', el); let tc = 0;
    box.innerHTML = MODULES.map((m, mi) => { const qs = QUIZZES.filter(q => q.mi === mi); const t = qs.reduce((a, q) => a + q.questions.length, 0); const c = qs.reduce((a, q) => a + (scores[q.qid]?.c || 0), 0); tc += c;
      return `<div class="frow"><span><b>${m.title}</b><br><span class="muted" style="font-size:.85rem">${m.unit}, ${m.part.replace("Parte","parte")}</span></span><div class="meter"><i style="width:0" data-w="${t ? c / t * 100 : 0}"></i></div><b class="mono">${c}/${t}</b></div>`; }).join('')
      + `<div class="note"><b>Total: ${tc} de ${TOTALQ} respuestas correctas.</b> ${tc === TOTALQ ? '¡Impecable! Dominás todos los temas.' : tc >= TOTALQ * .7 ? 'Muy buen trabajo. Repasá los módulos con barras más cortas.' : 'Volvé a los cuestionarios que te costaron: podés reintentarlos cuantas veces quieras.'}</div>
      <div><button class="btn ghost" id="resetAll">${ICON.redo}Borrar mi progreso</button></div>`;
    requestAnimationFrame(() => setTimeout(() => $$('.meter i', box).forEach(i => i.style.width = i.dataset.w + '%'), 80));
    $('#resetAll', box).onclick = () => { scores = {}; store.set('scores', scores); updateScore(); buildDrawer(); H.end(el); };
  },

/* ---------- Cuestionarios ---------- */
function runQuiz(box, s) {
  let qi = 0, ok = 0; const marks = [];
  const show = () => {
    const q = s.questions[qi];
    box.innerHTML = `<div class="qhead"><div class="qdots">${s.questions.map((_, i) => `<i class="${marks[i] === true ? 'ok' : marks[i] === false ? 'ko' : i === qi ? 'cur' : ''}"></i>`).join('')}</div><span>Pregunta ${qi + 1} de ${s.questions.length}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="qfb"></div>`;
    $$('.opt', box).forEach(b => b.onclick = () => answer(+b.dataset.j));
    $('.opt', box).focus({ preventScroll: true });
  };
  const answer = j => {
    const q = s.questions[qi], right = j === q.a; marks[qi] = right; if (right) ok++;
    $$('.opt', box).forEach((b, k) => { b.disabled = true; if (k === q.a) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); else b.classList.add('dim'); });
    $$('.qdots i', box)[qi].className = right ? 'ok' : 'ko';
    const last = qi === s.questions.length - 1;
    $('.qfb', box).innerHTML = `<div class="why ${right ? 'ok' : 'ko'}"><b>${right ? '¡Correcto!' : 'No es correcto.'}</b>${esc(q.why)}</div>
      <div class="qnav"><button class="btn nextq">${last ? 'Ver resultado' : 'Siguiente pregunta'}</button></div>`;
    const nb = $('.nextq', box); nb.focus({ preventScroll: true });
    nb.onclick = () => { if (last) result(); else { qi++; show(); } };
  };
  const result = () => {
    const t = s.questions.length, prev = scores[s.qid]?.c || 0;
    scores[s.qid] = { c: Math.max(prev, ok), t }; store.set('scores', scores); updateScore(); buildDrawer();
    const pct = ok / t, C = 2 * Math.PI * 54;
    const msg = pct === 1 ? ['¡Puntaje perfecto!', 'Respondiste todo bien. Seguí con el próximo tema.'] : pct >= .6 ? ['¡Bien hecho!', 'Repasá las explicaciones de las que fallaste y seguí adelante.'] : ['A repasar un poco', 'Volvé a las diapositivas anteriores y reintentá el cuestionario.'];
    box.innerHTML = `<div class="result"><svg class="ring" viewBox="0 0 132 132" role="img" aria-label="${ok} de ${t} correctas"><circle class="bgc" cx="66" cy="66" r="54"/><circle class="fgc" cx="66" cy="66" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="66" y="74" text-anchor="middle" font-size="26">${ok}/${t}</text></svg>
      <div><h3>${msg[0]}</h3><p class="muted" style="margin:0 0 14px">${msg[1]}${prev > ok ? ` Tu mejor puntaje sigue siendo ${prev}/${t}.` : ''}</p>
      <div class="qnav"><button class="btn ghost retry">${ICON.redo}Reintentar</button><button class="btn" data-go="next">Continuar</button></div></div></div>`;
    requestAnimationFrame(() => setTimeout(() => { const c = $('.fgc', box); if (c) c.style.strokeDashoffset = C * (1 - pct); }, 60));
    if (pct === 1) confetti(box);
    $('.retry', box).onclick = () => { qi = 0; ok = 0; marks.length = 0; show(); };
  };
  show();
}
function confetti(box) {
  if (RM.matches) return;
  const cv = document.createElement('canvas'); cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), W = cv.width = innerWidth, Hh = cv.height = innerHeight, cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--amber', '--mint', '--coral'].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 110 }, () => ({ x: W / 2 + (Math.random() - .5) * 200, y: Hh * .45, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 3, c: cols[Math.random() * 4 | 0], a: Math.random() * 6 }));
  let f = 0; (function tick() { ctx.clearRect(0, 0, W, Hh); ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else cv.remove(); })();
}

/* ---------- Demos interactivas ---------- */
const logLine = (log, text, cls = '') => { log.insertAdjacentHTML('beforeend', `<div class="${cls}">${esc(text)}</div>`); log.scrollTop = log.scrollHeight; };
const DEMOS = {
  clasificar(box) {
    const IT = [['Arreglo', 0, 'los elementos están uno al lado del otro, en las posiciones 0, 1, 2…'], ['Árbol genealógico', 1, 'una persona puede tener varios hijos: se ramifica.'], ['Fila del colectivo', 0, 'cada persona tiene a alguien adelante y alguien atrás.'], ['Grafo', 1, 'cada nodo puede conectarse con muchos otros.'], ['Pila de platos', 0, 'un plato arriba del otro, en un orden único.'], ['Mapa de rutas entre ciudades', 1, 'desde una ciudad salen rutas hacia varias ciudades.'], ['Lista enlazada', 0, 'cada nodo apunta a un único siguiente.'], ['Carpetas y subcarpetas', 1, 'una carpeta puede contener varias carpetas: es un árbol.'], ['Playlist de canciones', 0, 'una canción después de la otra.'], ['Cola de impresión', 0, 'los documentos esperan en orden de llegada.']];
    let i = 0, ok = 0; const done = [];

      const fin = i >= IT.length;
      box.innerHTML = `<div class="panel">${fin
        ? `<div class="bigcard"><span class="muted" style="font-size:.95rem;font-weight:500">Resultado</span>${ok} de ${IT.length} correctas</div><div class="qnav" style="justify-content:center"><button class="btn ghost again">${ICON.redo}Volver a jugar</button></div>`
        : `<div class="muted" style="text-align:center;font-size:.85rem">Ejemplo ${i + 1} de ${IT.length}</div><div class="bigcard">${IT[i][0]}</div><div class="qnav" style="justify-content:center"><button class="btn" data-a="0">Lineal</button><button class="btn" data-a="1">No lineal</button></div>`}</div>
        ${fb || ''}
        <div class="two">${['Lineales', 'No lineales'].map((h, k) => `<div class="panel"><h4>Pusiste en ${h.toLowerCase()}</h4><div class="pool">${done.filter(d => d.pick === k).map(d => `<span class="chip ${d.good ? 'good' : 'bad'}">${d.name}</span>`).join('') || '<span class="muted">Todavía nada.</span>'}</div></div>`).join('')}</div>`;

  parentesis(box) {
    const PRE = ['(a + b) * [c - d]', '{ [ ( ) ] }', '(a + b))', '( [ ) ]', '((x + 1)'];
    const CODE = P`<?php
function balanceado(string $texto): bool {
    $pila = new SplStack();
    $pares = [")" => "(", "]" => "[", "}" => "{"];
    foreach (str_split($texto) as $c) {
        if (in_array($c, ["(", "[", "{"])) {
            $pila->push($c);                         // abre: apilo
        } elseif (isset($pares[$c])) {
            if ($pila->isEmpty()) return false;      // cierre sin apertura
            if ($pila->pop() !== $pares[$c]) return false;   // no es su pareja
        }
    }
    return $pila->isEmpty();                         // ¿quedó algo abierto?
}`;
    let tk = 0;
    box.innerHTML = `<div class="ctrls" style="grid-template-columns:minmax(0,1fr) auto;align-items:end"><label class="ctrl"><span>Expresión</span><select class="ex">${PRE.map(p => `<option>${esc(p)}</option>`).join('')}</select></label><button class="btn go">${ICON.play}Verificar paso a paso</button></div>
      <div class="two"><div class="panel"><h4>Caracteres</h4><div class="cells chars"></div><div style="height:28px"></div><h4>Pila (el de arriba es el de la derecha)</h4><div class="ll stkh"></div><div style="height:14px"></div><div class="status"></div></div><pre class="code">${codeLines(CODE)}</pre></div>`;
    const lines = $$('.ln', box), st = $('.status', box);
    const mark = n => lines.forEach((l, i) => l.classList.toggle('hl', i === n));
    const chars = () => [...$('.ex', box).value].filter(c => c !== ' ');
    const drawStack = s => { $('.stkh', box).innerHTML = s.length ? s.map((c, k) => `<span class="node ${k === s.length - 1 ? 'cur' : ''}"><span class="v">${esc(c)}</span></span>`).join('') : '<span class="muted">vacía</span>'; };
    const reset = () => { tk++; $('.chars', box).innerHTML = chars().map(c => `<div class="cell">${esc(c)}</div>`).join(''); drawStack([]); mark(-1); st.textContent = 'Tocá «Verificar paso a paso».'; };
    $('.ex', box).onchange = reset;
    $('.go', box).onclick = async () => {
      reset(); const my = tk, nav = NAV, alive = () => my === tk && nav === NAV;
      const cs = chars(), cells = $$('.chars .cell', box), stack = [], pairs = { ')': '(', ']': '[', '}': '{' }; let res = null;
      for (let i = 0; i < cs.length; i++) {
        const c = cs[i]; cells[i].classList.add('cur'); let wait = 350;
        if ('([{'.includes(c)) { stack.push(c); mark(6); st.textContent = `«${c}» abre: lo pongo en la pila.`; wait = 850; }
        else if (pairs[c]) { wait = 850;
          if (!stack.length) { mark(8); res = [false, `«${c}» cierra, pero la pila está vacía: sobra un cierre.`]; cells[i].className = 'cell err'; break; }
          const t = stack.pop(); mark(9);
          if (t !== pairs[c]) { res = [false, `«${c}» cierra, pero el de arriba de la pila es «${t}»: no son pareja.`]; cells[i].className = 'cell err'; drawStack(stack); break; }
          st.textContent = `«${c}» cierra y el de arriba es «${t}»: son pareja, lo saco.`; }
        else { mark(4); st.textContent = `«${c}» no es un paréntesis: lo salteo.`; }
        drawStack(stack); await sleep(wait); if (!alive()) return;
        cells[i].className = 'cell ' + ('()[]{}'.includes(c) ? 'ok' : 'seen');
      }
      if (!res) { mark(12); res = stack.length ? [false, `Terminé, pero quedaron ${stack.length} sin cerrar.`] : [true, 'Terminé y la pila quedó vacía: todo lo que se abrió, se cerró.']; }
      st.innerHTML = `<b>${res[0] ? '¡Está bien!' : 'Está mal.'}</b> ${res[1]}`;
    };
    reset();
  },

      st.innerHTML = `<b>Arreglo: ${s} pasos</b> (corrió ${n} datos y después puso el nuevo). <b>Lista: 1 paso.</b> Con más datos, la diferencia es todavía más grande.`;
    };
    $('.rd', box).onclick = async () => {
      if (A.length < 5) return;
      const my = ++tk, nav = NAV, alive = () => my === tk && nav === NAV;
      drawA(A, { 4: 'found' }); $('.sa', box).textContent = 1; st.textContent = 'El arreglo fue directo al lugar 4 (1 paso). La lista tiene que seguir las flechas desde el principio…';
      for (let i = 0; i <= 4; i++) { $('.sl', box).textContent = i + 1; drawL({ [i]: i === 4 ? 'found' : 'cur' }); await sleep(450); if (!alive()) return; }
      st.innerHTML = `<b>Arreglo: 1 paso. Lista: 5 pasos.</b> Los dos encontraron ${A[4]}, pero el arreglo fue directo y la lista tuvo que pasar por todos. Esta vez ganó el arreglo.`;
    };
    $('.rst', box).onclick = reset;
    reset();
  },

  insercion(box) {
    const NAMES = ['Martina', 'Carlos', 'Zoe', 'Ana', 'Lucas', 'Beatriz', 'Iván'];
    const CODE = P`<?php
function insercion(array $a): array {
    for ($i = 1; $i < count($a); $i++) {
        $actual = $a[$i];                  // tomo el siguiente nombre
        $j = $i - 1;
        while ($j >= 0 && strcmp($a[$j], $actual) > 0) {
            $a[$j + 1] = $a[$j];           // corro el mayor a la derecha
            $j--;
        }
        $a[$j + 1] = $actual;              // lo inserto en su lugar
    }
    return $a;
}

echo implode(", ", insercion($nombres));`;
    let arr, tk = 0;
    box.innerHTML = `<div class="two"><div class="panel"><div class="cells nm"></div><div style="height:28px"></div><div class="status"></div><div style="height:10px"></div>
      <div class="counters"><span>Comparaciones: <b class="cc">0</b></span><span>Movimientos: <b class="cm">0</b></span></div>
      <div class="qnav"><button class="btn go">${ICON.play}Ordenar</button><button class="btn ghost mix">${ICON.redo}Mezclar</button></div>
      <div class="term" style="margin-top:14px"><div class="term-h"><span class="p">$</span> php insercion.php</div><pre class="term-out"></pre></div></div>
      <pre class="code">${codeLines(CODE)}</pre></div>`;
    const lines = $$('.ln', box), st = $('.status', box);
    const mark = n => lines.forEach((l, i) => l.classList.toggle('hl', i === n));
    const draw = (cls = {}, sorted = 0) => { $('.nm', box).innerHTML = arr.map((v, i) => `<div class="cell w ${cls[i] || (i < sorted ? 'ok' : '')}">${v}<small>${i}</small></div>`).join(''); };
    const mix = () => { tk++; arr = [...NAMES].sort(() => Math.random() - .5); draw(); mark(-1); $('.cc', box).textContent = 0; $('.cm', box).textContent = 0;
      $('.term-out', box).innerHTML = `<span class="dim">$nombres = [${arr.map(x => `"${x}"`).join(', ')}];</span>`; st.textContent = 'Los nombres con borde verde ya están ordenados.'; };
    $('.mix', box).onclick = mix;
    $('.go', box).onclick = async () => {
      const my = ++tk, nav = NAV, alive = () => my === tk && nav === NAV; let c = 0, m = 0;
      $('.cc', box).textContent = 0; $('.cm', box).textContent = 0;
      for (let i = 1; i < arr.length; i++) {
        const key = arr[i]; mark(3); draw({ [i]: 'cur' }, i); st.innerHTML = `Agarro <b>${key}</b> y busco su lugar entre los que ya están ordenados.`; await sleep(800); if (!alive()) return;
        let j = i - 1;
        while (j >= 0) {
          c++; $('.cc', box).textContent = c; mark(5); draw({ [j]: 'prev', [j + 1]: 'cur' }, i + 1);
          const bigger = arr[j] > key; st.innerHTML = `¿«${arr[j]}» va después de «${key}»? <b>${bigger ? 'Sí: lo corro a la derecha.' : 'No: encontré el lugar.'}</b>`;
          await sleep(750); if (!alive()) return;
          if (!bigger) break;
          [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; m++; $('.cm', box).textContent = m; mark(6); draw({ [j]: 'cur' }, i + 1); await sleep(450); if (!alive()) return; j--;
        }
        mark(9); draw({}, i + 1); await sleep(400); if (!alive()) return;
      }
      draw({}, arr.length); mark(14); st.innerHTML = `<b>¡Listo!</b> Hice ${c} comparaciones y ${m} movimientos. Es la misma lista, ahora ordenada.`;
      typeOut($('.term-out', box), arr.join(', '));
    };
    mix();
  },
};

/* ---------- Navegación ---------- */
const wrap = $('#wrap');
function go(i, dir) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i)); if (i === cur) return;
  dir = dir ?? (i > cur ? 1 : -1); NAV++;
  const s = SLIDES[i], m = MODULES[s.mi];
  const old = $('.slide:not(.leave)', wrap);
  if (old) { old.style.setProperty('--dir', dir); old.classList.add('leave'); setTimeout(() => old.remove(), 230); }
  const el = document.createElement('section'); el.className = 'slide enter'; el.style.setProperty('--dir', dir);
  el.setAttribute('aria-label', s.title); el.innerHTML = R[s.type](s); wrap.appendChild(el);
  H[s.type]?.(el, s);
  $$('[data-go="next"]', el).forEach(b => b.onclick = () => go(cur + 1));
  cur = i;
  $('#tabName').textContent = s.file || 'slide.php';
  $('#crumb').textContent = `${m.unit}, ${m.part.replace('Parte','parte')}`;
  $('#modName').textContent = `${s.mi + 1}. ${m.title}`;
  $('#pos').innerHTML = `<b>${i + 1}</b> de ${SLIDES.length}`;
  $('#bar').style.width = ((i + 1) / SLIDES.length * 100) + '%';
  $('#prev').disabled = i === 0; $('#next').disabled = i === SLIDES.length - 1;
  store.set('pos', i);
  try { history.replaceState(null, '', '#' + (i + 1)); } catch {}
  markDrawer();
}

/* ---------- Índice lateral ---------- */
function buildDrawer() {
  const open = new Set($$('.dmod.open').map(d => +d.dataset.mi)); if (!open.size && cur >= 0) open.add(SLIDES[cur].mi);
  $('#dlist').innerHTML = MODULES.map((m, mi) => {
    const qs = QUIZZES.filter(q => q.mi === mi), t = qs.reduce((a, q) => a + q.questions.length, 0), c = qs.reduce((a, q) => a + (scores[q.qid]?.c || 0), 0);
    return `<div class="dmod ${open.has(mi) ? 'open' : ''}" data-mi="${mi}"><button aria-expanded="${open.has(mi)}"><span class="num">${mi + 1}</span><span class="mt"><b>${m.title}</b><span>${m.unit}, ${m.part.replace('Parte','parte')}: ${c}/${t} correctas</span></span>${ICON.chev}</button>
      <ul class="dslides">${m.slides.map(s => `<li><button data-i="${s.idx}">${s.type === 'quiz' ? 'Cuestionario' : s.type === 'cover' ? 'Portada' : s.title}${s.type === 'quiz' ? `<span class="qb ${scores[s.qid] ? 'done' : ''}">${scores[s.qid] ? scores[s.qid].c + '/' + scores[s.qid].t : s.questions.length + ' preg.'}</span>` : ''}</button></li>`).join('')}</ul></div>`;
  }).join('');
  $$('.dmod>button').forEach(b => b.onclick = () => { const d = b.parentElement; d.classList.toggle('open'); b.setAttribute('aria-expanded', d.classList.contains('open')); });
  $$('.dslides button').forEach(b => b.onclick = () => { go(+b.dataset.i); drawer(false); });
  markDrawer();
}
function markDrawer() { $$('.dslides button').forEach(b => b.classList.toggle('cur', +b.dataset.i === cur)); }
function drawer(on) { $('#drawer').classList.toggle('on', on); $('#backdrop').classList.toggle('on', on); $('#menuBtn').setAttribute('aria-expanded', on);
  if (on) { const s = SLIDES[cur]; const d = $(`.dmod[data-mi="${s.mi}"]`); if (d && !d.classList.contains('open')) d.firstElementChild.click(); setTimeout(() => $('.dslides button.cur')?.scrollIntoView({ block: 'center' }), 50); } }
function updateScore() { const c = Object.values(scores).reduce((a, x) => a + x.c, 0); $('#scoreTxt').textContent = `${c}/${TOTALQ}`; }

/* ---------- Tema ---------- */
const root = document.documentElement;
function setTheme(t) { root.setAttribute('data-theme', t); store.set('theme', t); }
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* ---------- Eventos globales ---------- */
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
$('#menuBtn').onclick = () => drawer(true);
$('#closeDrawer').onclick = $('#backdrop').onclick = () => drawer(false);
$('#scoreBtn').onclick = () => go(SLIDES.length - 1);
if (!document.fullscreenEnabled) $('#fsBtn').style.display = 'none';
$('#fsBtn').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen(); } catch {} };
document.addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') return drawer(false);
  if ($('#drawer').classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SLIDES.length - 1);
  else if (SLIDES[cur].type === 'quiz' && /^[a-dA-D1-4]$/.test(e.key)) { const j = isNaN(e.key) ? 'abcd'.indexOf(e.key.toLowerCase()) : +e.key - 1; $$('.slide:not(.leave) .opt:not([disabled])')[j]?.click(); }
});
let tx = null, ty = 0;
$('#stage').addEventListener('touchstart', e => { tx = e.target.closest('.code,.twrap,input,.bars,.cells,.log,.chart,.flip,.ll,.que,.stk') ? null : e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#stage').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; }, { passive: true });

/* ---------- Inicio ---------- */
const fromHash = parseInt(location.hash.slice(1), 10);
updateScore(); buildDrawer();
go(!isNaN(fromHash) ? fromHash - 1 : store.get('pos', 0), 1);
</script>
</body>
