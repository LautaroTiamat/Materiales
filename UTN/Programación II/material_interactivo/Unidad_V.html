<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programación II · Unidad V: TAD Grafo y Tablas Hash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF6;--surface:#FFFFFF;--surface-2:#F5F6FB;--line:#D6D9E8;--line-strong:#B9BDD6;
  --text:#1D1F33;--muted:#585C7D;--accent:#4F5B93;--accent-ink:#FFFFFF;--accent-soft:#E2E5F4;
  --amber:#8F5600;--amber-soft:#FBEFD9;--coral:#B83B30;--coral-soft:#FBE3E0;--mint:#17734F;--mint-soft:#DDF2E8;
  --code-bg:#F7F8FC;--code-gutter:#A2A6C0;--code-hl:#E9ECF8;
  --t-kw:#6A3DB8;--t-var:#B3332A;--t-str:#7F5300;--t-num:#9A4F00;--t-fn:#0A6A94;--t-cls:#136B4C;--t-com:#7D819C;--t-this:#C0306A;
  --term-bg:#1C1D2B;--term-text:#E7E7F1;--term-muted:#8C8FB0;
  --shadow:0 1px 0 rgba(30,32,60,.04),0 18px 40px -24px rgba(30,32,60,.45);
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171824;--surface:#202233;--surface-2:#282B40;--line:#34374F;--line-strong:#4A4E6E;
    --text:#ECEBF5;--muted:#A4A6C2;--accent:#A3ACE6;--accent-ink:#171824;--accent-soft:#2E3252;
    --amber:#F2BE5C;--amber-soft:#3A3122;--coral:#F3877A;--coral-soft:#3D2629;--mint:#72D3A8;--mint-soft:#1F3A30;
    --code-bg:#1B1D2C;--code-gutter:#5B5F80;--code-hl:#2A2E48;
    --t-kw:#C0A9FF;--t-var:#FF9389;--t-str:#EBC777;--t-num:#F7B26A;--t-fn:#86D0F2;--t-cls:#8EDDB6;--t-com:#7C7FA0;--t-this:#FF8FC0;
    --term-bg:#11121C;--shadow:0 1px 0 rgba(0,0,0,.2),0 24px 48px -28px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171824;--surface:#202233;--surface-2:#282B40;--line:#34374F;--line-strong:#4A4E6E;
  --text:#ECEBF5;--muted:#A4A6C2;--accent:#A3ACE6;--accent-ink:#171824;--accent-soft:#2E3252;
  --amber:#F2BE5C;--amber-soft:#3A3122;--coral:#F3877A;--coral-soft:#3D2629;--mint:#72D3A8;--mint-soft:#1F3A30;
  --code-bg:#1B1D2C;--code-gutter:#5B5F80;--code-hl:#2A2E48;
  --t-kw:#C0A9FF;--t-var:#FF9389;--t-str:#EBC777;--t-num:#F7B26A;--t-fn:#86D0F2;--t-cls:#8EDDB6;--t-com:#7C7FA0;--t-this:#FF8FC0;
  --term-bg:#11121C;--shadow:0 1px 0 rgba(0,0,0,.2),0 24px 48px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--mono);font-size:.9em}
.app{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;overflow:hidden}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding:10px clamp(10px,2.4vw,24px);border-bottom:1px solid var(--line);background:var(--surface)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:background .2s,border-color .2s}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.iconbtn svg{width:20px;height:20px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:0 1 auto}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elephant{width:38px;height:24px;flex:none}
.modname{margin-left:auto;margin-right:auto;font-weight:600;color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.right{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.modname+.right{margin-left:0}
.score{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--text);font-weight:600;font-size:.88rem;border:0}
.score svg{width:16px;height:16px;color:var(--accent)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.theme-ico .moon{display:none}
:root[data-theme="dark"] .theme-ico .sun{display:none}
:root[data-theme="dark"] .theme-ico .moon{display:block}

/* ---------- Stage / frame ---------- */
.stage{position:relative;overflow:hidden;padding:clamp(8px,2vw,22px);min-height:0}
.frame{position:relative;height:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;border-bottom:1px solid var(--line);background:var(--surface-2);flex:none}
.tab{display:inline-flex;align-items:center;gap:8px;height:100%;padding:0 12px;font-family:var(--mono);font-size:.8rem;color:var(--text);background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;top:1px}
.tab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.crumb{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-wrap{position:relative;flex:1;min-height:0}
.slide{position:absolute;inset:0;overflow:auto;padding:clamp(18px,3.6vw,46px) clamp(16px,4vw,56px) clamp(24px,3.6vw,46px);scrollbar-gutter:stable}
.slide.enter{animation:slideIn .42s cubic-bezier(.2,.8,.2,1) both}
.slide.leave{animation:slideOut .22s ease both;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*36px))}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(calc(var(--dir,1)*-24px))}}
.rv{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stitle{font-size:clamp(1.55rem,3.1vw,2.5rem);line-height:1.12;letter-spacing:-.02em;font-weight:700;margin:0 0 .5em;max-width:28ch}
.stitle .brace,.cbrace{font-family:var(--mono);font-weight:400;color:var(--accent);opacity:.7}
.stitle .brace{margin-left:.35em}
.cbrace{font-size:clamp(1.4rem,2.6vw,2rem);margin-top:22px;line-height:1}
.lead{font-size:clamp(1.02rem,1.5vw,1.22rem);max-width:68ch;margin:0 0 1.1em;color:var(--text)}
.lead b,.pts b,.card b{font-weight:650}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:.85em;padding:0 .45em;border-radius:6px;background:var(--accent-soft);color:var(--text)}
.pts{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:10px;max-width:72ch}
.pts li{position:relative;padding-left:22px}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.pts li b{color:var(--text)}
.ptitle{font-size:.95rem;font-weight:700;margin:1.2em 0 .6em;color:var(--muted)}
.analogy{display:flex;gap:14px;align-items:flex-start;max-width:72ch;margin:1.2em 0 0;padding:16px 18px;border-radius:12px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.analogy svg{flex:none;width:24px;height:24px;color:var(--amber);margin-top:2px}
.analogy p{margin:0}
.analogy strong{display:block;font-size:.85rem;color:var(--amber);margin-bottom:2px}
.note{max-width:76ch;margin:1.2em 0 0;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:0 0 1em}
.group{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.group h3{margin:0 0 6px;font-size:1.1rem}
.group p{margin:0}
.group .pts{margin:8px 0 0}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,220px)),1fr));gap:14px;margin:0 0 .5em}
.card{position:relative;padding:18px 18px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left}
.card h3{margin:0 0 6px;font-size:1.08rem;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted)}
.card ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.card .ex{margin-top:12px;font-family:var(--mono);font-size:.78rem;padding:8px 10px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line);overflow-x:auto;white-space:pre}
.cards.flow{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}
.cards.flow .card::after{content:"";position:absolute;right:-26px;top:50%;width:18px;height:18px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.cards.flow .card:last-child::after{display:none}
.cards.flow .card h3{color:var(--accent)}
@media (max-width:720px){.cards.flow{grid-template-columns:1fr;gap:30px}.cards.flow .card::after{right:50%;top:auto;bottom:-24px;transform:translateX(50%) rotate(135deg)}}
.flip{perspective:900px;padding:0;border:0;background:none;min-height:190px}
.flip-in{position:relative;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.face h3{margin:0 0 6px;font-size:1.15rem}
.face p{margin:0;color:var(--muted)}
.face.back p{color:var(--text)}
.face small{margin-top:auto;color:var(--accent);font-weight:600;font-size:.8rem}

/* steps */
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;counter-reset:st}
.steps>li{counter-increment:st;position:relative;padding:54px 16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.steps>li::before{content:counter(st);position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.9rem}
.steps h3{margin:0 0 4px;font-size:1.02rem}
.steps p{margin:0;color:var(--muted);font-size:.95rem}
.steps ul{margin:8px 0 0;padding-left:18px;font-size:.92rem}

/* tables */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:0 0 1em}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);font-weight:700}
tbody th{font-weight:700;color:var(--accent);white-space:nowrap;background:var(--surface-2);width:1%}
tbody tr:last-child>*{border-bottom:0}
td code{background:var(--code-bg);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}

/* cover */
.cover{min-height:100%;display:grid;align-content:center;gap:10px;max-width:900px}
.cover .unit{font-family:var(--mono);color:var(--accent);font-size:.95rem}
.cover h1{font-size:clamp(2.4rem,7vw,5.2rem);line-height:.98;letter-spacing:-.035em;margin:0;font-weight:700}
.cover h1 .brace{font-family:var(--mono);font-weight:400;color:var(--accent);font-size:.6em;vertical-align:.15em;margin-left:.15em}
.cover .sub{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--muted);max-width:52ch;margin:6px 0 10px}
.topics{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:8px 0 0;list-style:none}
.topics button{border:1px solid var(--line);background:var(--surface-2);padding:8px 14px;border-radius:999px;font-size:.92rem;transition:border-color .2s,background .2s}
.topics button:hover{border-color:var(--accent);background:var(--accent-soft)}
.cover .start{justify-self:start;margin-top:18px}

/* buttons / controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ctrls{display:grid;gap:12px;margin:0 0 14px}
.ctrl{display:grid;gap:5px;font-size:.88rem;color:var(--muted);font-weight:500}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select{height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:.9rem;width:100%}
.ctrl input:focus,.ctrl select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl output{font-family:var(--mono);color:var(--text);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-family:var(--mono);font-size:.82rem;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--text)}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .2s;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* code */
.code-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.code-layout{grid-template-columns:minmax(0,1fr)}}
.code{position:relative;margin:0;font-family:var(--mono);font-size:clamp(.74rem,1.02vw,.86rem);line-height:1.65;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:14px 0;counter-reset:l;tab-size:4}
.code.flash{animation:flash .6s ease}
@keyframes flash{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 0 transparent}}
.ln{display:block;padding:0 18px 0 0;white-space:pre;min-height:1.65em}
.ln::before{counter-increment:l;content:counter(l);display:inline-block;width:2.4em;margin-right:1.1em;text-align:right;color:var(--code-gutter);user-select:none}
.ln.hl{background:var(--code-hl)}
.ln.click{cursor:pointer;transition:background .15s}
.ln.click:hover{background:var(--code-hl)}
.ln.bad{background:var(--coral-soft)}
.ln.good{background:var(--mint-soft)}
.t-kw{color:var(--t-kw);font-weight:600}.t-var{color:var(--t-var)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-fn{color:var(--t-fn)}.t-cls{color:var(--t-cls)}.t-com{color:var(--t-com);font-style:italic}.t-this{color:var(--t-this);font-weight:600}.t-tag{color:var(--t-kw)}
.side{display:grid;gap:14px}
.term{background:var(--term-bg);color:var(--term-text);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:.84rem;border:1px solid #2c2e44}
.term-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #2c2e44;color:var(--term-muted);font-size:.78rem}
.term-h .p{color:#A3ACE6}
.term-out{margin:0;padding:14px;min-height:96px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.term-out .e{color:#FF8E82}.term-out .w{color:#F2C15F}.term-out .ok{color:#7FDDB2}.term-out .dim{color:var(--term-muted)}
.caret{display:inline-block;width:8px;height:1.05em;background:#A3ACE6;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.extra{margin-top:4px}

/* quiz */
.quiz{max-width:780px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--muted);font-size:.9rem}
.qdots{display:flex;gap:6px}
.qdots i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.qdots i.cur{background:var(--accent)}
.qdots i.ok{background:var(--mint)}
.qdots i.ko{background:var(--coral)}
.qtext{font-size:clamp(1.1rem,1.8vw,1.35rem);font-weight:600;line-height:1.35;margin:0 0 16px;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(3px)}
.opt .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:.85rem}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.right .k{background:var(--mint);color:#fff;border-color:var(--mint)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);animation:shake .4s}
.opt.wrong .k{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.why{margin:14px 0 0;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);animation:rise .35s both}
.why b{display:block;margin-bottom:2px}
.why.ok b{color:var(--mint)}.why.ko b{color:var(--coral)}
.qnav{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.result{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:560px){.result{grid-template-columns:1fr;justify-items:start}}
.ring{width:132px;height:132px}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--sans);font-weight:700;fill:var(--text)}
.result h3{margin:0 0 4px;font-size:1.4rem}

/* footer */
.foot{display:flex;align-items:center;gap:12px;padding:10px clamp(10px,2.4vw,24px);border-top:1px solid var(--line);background:var(--surface)}
.foot .pos{font-size:.88rem;color:var(--muted);margin:0 auto;text-align:center;white-space:nowrap}
.foot .pos b{color:var(--text)}
.navbtn{height:42px}
@media (max-width:560px){.top{gap:8px}#fsBtn{display:none!important}.elephant{width:32px}.frow{grid-template-columns:minmax(0,1fr) 48px;gap:6px 12px}.frow>span{grid-column:1/-1}.refs{grid-template-columns:1fr;gap:6px}.navbtn span{display:none}.navbtn{padding:0 14px}.modname{display:none}.brand span{display:none}.score{padding:0 10px}}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(10,10,25,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--surface);border-right:1px solid var(--line);z-index:21;transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:1.05rem}
.dlist{overflow:auto;padding:8px 8px 24px}
.dmod{margin:4px 0}
.dmod>button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px;border:0;background:transparent}
.dmod>button:hover{background:var(--surface-2)}
.dmod .num{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);font-family:var(--mono);font-weight:600;font-size:.82rem}
.dmod .mt{flex:1;min-width:0}
.dmod .mt b{display:block;font-size:.95rem}
.dmod .mt span{font-size:.78rem;color:var(--muted)}
.dmod .chev{width:16px;height:16px;transition:transform .2s;color:var(--muted)}
.dmod.open .chev{transform:rotate(90deg)}
.dslides{list-style:none;margin:0 0 6px 50px;padding:0;display:none}
.dmod.open .dslides{display:block}
.dslides button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:.88rem;color:var(--muted)}
.dslides button:hover{background:var(--surface-2);color:var(--text)}
.dslides button.cur{background:var(--accent-soft);color:var(--text);font-weight:600}
.dslides .qb{margin-left:auto;font-family:var(--mono);font-size:.74rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.dslides .qb.done{background:var(--mint-soft);border-color:var(--mint);color:var(--text)}

/* demos */
.demo{display:grid;gap:16px}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}
.panel h4{margin:0 0 10px;font-size:.9rem;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);text-align:left;transition:transform .15s,border-color .2s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o;min-height:44px}
.order li button{width:100%;counter-increment:o;justify-content:flex-start}
.order li button::before{content:counter(o);display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8rem;flex:none}
.order li.bad button{border-color:var(--coral);background:var(--coral-soft)}
.order li.good button{border-color:var(--mint);background:var(--mint-soft)}
.msg{padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);animation:rise .3s both}
.msg.ok{background:var(--mint-soft);border-color:var(--mint)}
.msg.ko{background:var(--coral-soft);border-color:var(--coral)}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{position:relative;width:46px;height:52px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:600;transition:all .25s}
.cell small{position:absolute;bottom:-17px;font-size:.66rem;color:var(--muted);font-weight:400}
.cell.cur{border-color:var(--amber);background:var(--amber-soft);transform:translateY(-4px)}
.cell.seen{opacity:.45}
.cell.out{opacity:.22}
.cell.found{border-color:var(--mint);background:var(--mint-soft);transform:translateY(-4px) scale(1.06)}
.status{font-family:var(--mono);font-size:.85rem;min-height:1.6em;color:var(--text)}
.bars{display:flex;align-items:flex-end;gap:clamp(4px,1vw,10px);height:200px;padding:10px 4px 0}
.bar{flex:1;border-radius:7px 7px 0 0;background:var(--accent);opacity:.85;display:flex;align-items:flex-start;justify-content:center;font-family:var(--mono);font-size:.75rem;color:var(--accent-ink);padding-top:4px;transition:height .25s ease,background .2s}
.bar.cmp{background:var(--amber)}
.bar.swp{background:var(--coral)}
.bar.done{background:var(--mint)}
.counters{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.counters b{color:var(--text);font-family:var(--mono)}
.stack{display:flex;flex-direction:column-reverse;gap:6px;min-height:260px;justify-content:flex-start}
.frame-c{padding:9px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-family:var(--mono);font-size:.82rem;animation:rise .3s both;display:flex;justify-content:space-between;gap:10px}
.frame-c.top{border-color:var(--amber);background:var(--amber-soft)}
.frame-c.ret{border-color:var(--mint);background:var(--mint-soft)}
.inspect{font-family:var(--mono);font-size:.86rem;display:grid;gap:8px}
.attr{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.attr span:first-child{color:var(--t-var)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.h i{background:var(--amber)}
.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.08)}}
.log{font-family:var(--mono);font-size:.82rem;background:var(--term-bg);color:var(--term-text);border-radius:10px;padding:12px;height:180px;overflow:auto}
.log div{animation:rise .25s both}
.log .c{color:#A3ACE6}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.obj{border:1px solid var(--line-strong);border-radius:12px;padding:12px;background:var(--surface);font-family:var(--mono);font-size:.78rem;animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes popIn{from{opacity:0;transform:scale(.7)}}
.obj b{color:var(--t-var)}
.obj svg{width:100%;height:56px;margin:4px 0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.refs{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;align-items:center}
.vbox{font-family:var(--mono);padding:10px 14px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);white-space:nowrap}
.objbox{padding:12px 14px;border-radius:12px;border:2px solid;font-family:var(--mono);font-size:.85rem}
.o1{border-color:var(--accent);background:var(--accent-soft)}
.o2{border-color:var(--amber);background:var(--amber-soft)}
.arrow{color:var(--muted);font-family:var(--mono);font-size:.85rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.two>*,.panel,.side,.demo>*{min-width:0}
.slide{overflow-x:hidden}
.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcell{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem;transition:all .25s}
.mcell b{display:block;font-size:1.1rem}
.mcell.yes{border-color:var(--mint);background:var(--mint-soft)}
.mcell.no{border-color:var(--coral);background:var(--coral-soft)}
.mcell.sel{outline:2px solid var(--accent);outline-offset:2px}
.bigo-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.lg{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);border-left-width:4px}
.lg b{font-family:var(--mono)}
.lg span{font-size:.8rem;color:var(--muted)}
.lg em{font-style:normal;font-family:var(--mono);font-size:.85rem;color:var(--text)}
.bigo-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(200px,1fr);gap:14px;align-items:start}.bigo-grid .bigo-legend{grid-template-columns:1fr}@media (max-width:820px){.bigo-grid{grid-template-columns:1fr}.bigo-grid .bigo-legend{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}}
.chart{width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.chart path{fill:none;stroke-width:3;stroke-linecap:round;transition:d .4s}
.chart .ax{stroke:var(--line-strong);stroke-width:1}
.chart text{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.cmpbars{display:grid;gap:10px}
.cmpbars .row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.cmpbars .track{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.cmpbars .track i{display:block;height:100%;border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.final{display:grid;gap:12px;max-width:780px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 140px 60px;gap:12px;align-items:center}
.frow .meter{height:12px;width:100%}

/* ---------- Componentes de demos ---------- */
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn.sm{height:36px;padding:0 12px;font-size:.85rem}
.bigcard{display:grid;justify-items:center;gap:4px;text-align:center;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:700;letter-spacing:-.01em;margin:8px 0 4px}
.chip.good{border-color:var(--mint);background:var(--mint-soft)}
.chip.bad{border-color:var(--coral);background:var(--coral-soft)}
.cell.w{width:auto;min-width:56px;padding:0 12px;font-size:.88rem}
button.cell{cursor:pointer;color:var(--text)}
.cell.ok{border-color:var(--mint)}
.cell.prev{border-color:var(--amber);background:var(--amber-soft)}
.cell.next{border-color:var(--mint);background:var(--mint-soft)}
.cell.empty{border-style:dashed;color:var(--muted);font-weight:400}
.cell.err{border-color:var(--coral);background:var(--coral-soft);animation:shake .4s}
.log .e{color:#FF8E82}.log .dim{color:var(--term-muted)}
.stk{display:flex;flex-direction:column-reverse;gap:6px;min-height:290px;padding:10px;border:2px solid var(--line-strong);border-top:0;border-radius:0 0 14px 14px;background:var(--surface)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface-2);font-family:var(--mono);font-size:.88rem;transition:opacity .25s,transform .25s}
.it small{color:var(--amber);font-size:.72rem;font-weight:600}
.it.tope{border-color:var(--amber);background:var(--amber-soft)}
.it.fresh{animation:drop .35s cubic-bezier(.2,.8,.2,1) both}
.it.out{opacity:0;transform:translateY(-22px)}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}}
.que{display:flex;gap:8px;align-items:stretch;min-height:66px;padding:10px;border-top:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);background:var(--surface);overflow-x:auto}
.it.qi{flex:none;flex-direction:column;justify-content:center;gap:2px;min-width:72px}
.it.qi.fresh{animation:slideL .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}}
.qlabels{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--muted);margin:0 2px 6px}
.ll{display:flex;flex-wrap:wrap;align-items:center;gap:8px 5px;font-family:var(--mono);font-size:.86rem;min-height:44px}
.node{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface);transition:transform .25s,border-color .25s,background .25s}
.node .v{padding:8px 10px;font-weight:600;min-width:36px;text-align:center}
.node .p{padding:8px 9px;border-left:1.5px solid var(--line-strong);color:var(--accent);background:var(--surface-2)}
.node.cur{border-color:var(--amber);background:var(--amber-soft);transform:translateY(-3px)}
.node.found{border-color:var(--mint);background:var(--mint-soft);transform:translateY(-3px)}
.node.new{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both;border-color:var(--accent);background:var(--accent-soft)}
.ar{color:var(--accent);font-weight:700}
.nul{color:var(--muted);font-style:italic}
.ptr{font-size:.76rem;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--text)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- Unidad IV: árboles ---------- */
.tree{width:100%;height:auto;max-height:300px;display:block;margin:0 auto}
.tree .ed{stroke:var(--line-strong);stroke-width:2;transition:stroke .25s,opacity .25s}
.tree .ed.hl{stroke:var(--accent);stroke-width:3.5}
.tree .ed.dim{opacity:.3}
.tree .tn circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:2;transition:fill .25s,stroke .25s}
.tree .tn text{font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--text)}
.tree .tn .sub{font-size:11px;font-weight:600;fill:var(--muted);font-family:var(--sans)}
.tree .tn.click{cursor:pointer}
.tree .tn.click:hover circle{stroke:var(--accent);stroke-width:3}
.tree .tn.cur circle{fill:var(--amber-soft);stroke:var(--amber);stroke-width:3}
.tree .tn .in{transform-box:fill-box;transform-origin:center}
.tree .tn.cur .in{animation:pop .45s}
.tree .tn.found circle{fill:var(--mint-soft);stroke:var(--mint);stroke-width:3}
.tree .tn.path circle{fill:var(--accent-soft);stroke:var(--accent)}
.tree .tn.sel circle{fill:var(--accent);stroke:var(--accent)}
.tree .tn.sel text{fill:var(--accent-ink)}
.tree .tn.sel .sub{fill:var(--muted)}
.tree .tn.kid circle{fill:var(--mint-soft);stroke:var(--mint);stroke-width:3}
.tree .tn.par circle{fill:var(--amber-soft);stroke:var(--amber);stroke-width:3}
.tree .tn.sib circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.tree .tn.err circle{fill:var(--coral-soft);stroke:var(--coral);stroke-width:3}
.tree .tn.err .in{animation:shake .4s}
.tree .tn.new .in{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.tree .tn.ghost circle{fill:none;stroke:var(--amber);stroke-dasharray:5 4;stroke-width:2.5}
.tree .tn.ghost text{fill:var(--amber)}
.tree .tn.ghost .in{animation:blink 1s steps(1) infinite}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.84rem;color:var(--muted);padding:0 4px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid}
.seq{min-height:52px}
.lead,.pts,.note,.analogy{max-width:none}
.cell.seen{opacity:.4}

/* ---------- Unidad V: grafos ---------- */
.graph{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;overflow:visible}
.graph .ge .ln2{fill:none;stroke:var(--line-strong);stroke-width:2.4;stroke-linecap:round;transition:stroke .25s,stroke-width .25s,opacity .25s}
.graph .ge .hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:26;pointer-events:stroke}
.graph .ge.click,.graph .gv.click{-webkit-tap-highlight-color:transparent}
.graph .ge .ah{fill:var(--line-strong);transition:fill .25s,opacity .25s}
.graph .ge.click{cursor:pointer}
.graph .ge.click:hover .ln2{stroke:var(--accent)}
.graph .ge.click:hover .ah{fill:var(--accent)}
.graph .ge.hl .ln2{stroke:var(--accent);stroke-width:3.6}.graph .ge.hl .ah{fill:var(--accent)}
.graph .ge.sel .ln2{stroke:var(--amber);stroke-width:4.2}.graph .ge.sel .ah{fill:var(--amber)}
.graph .ge.adj .ln2{stroke:var(--mint);stroke-width:3.6}.graph .ge.adj .ah{fill:var(--mint)}
.graph .ge.par .ln2{stroke:var(--coral);stroke-width:3.6}.graph .ge.par .ah{fill:var(--coral)}
.graph .ge.dim .ln2,.graph .ge.dim .ah{opacity:.22}
.graph .ge.new .ln2{stroke:var(--accent);stroke-width:3.6;stroke-dasharray:400;animation:draw .6s ease both}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.graph .gv circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:2.2;transition:fill .25s,stroke .25s,opacity .25s}
.graph .gv text{font-family:var(--mono);font-weight:700;font-size:16px;fill:var(--text);pointer-events:none}
.graph .gv .sub{font-family:var(--sans);font-size:11.5px;font-weight:600;fill:var(--muted)}
.graph .gv .in{transform-box:fill-box;transform-origin:center}
.graph .gv.click{cursor:pointer}
.graph .gv.click:hover circle{stroke:var(--accent);stroke-width:3}
.graph .gv.cur circle{fill:var(--amber-soft);stroke:var(--amber);stroke-width:3}
.graph .gv.cur .in{animation:pop .45s}
.graph .gv.found circle{fill:var(--mint-soft);stroke:var(--mint);stroke-width:3}
.graph .gv.kid circle{fill:var(--mint-soft);stroke:var(--mint);stroke-width:3}
.graph .gv.path circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.graph .gv.sel circle{fill:var(--accent);stroke:var(--accent)}
.graph .gv.sel>.in>text:not(.sub){fill:var(--accent-ink)}
.graph .gv.err circle{fill:var(--coral-soft);stroke:var(--coral);stroke-width:3}
.graph .gv.err .in{animation:shake .4s}
.graph .gv.g1 circle{fill:var(--amber-soft);stroke:var(--amber);stroke-width:3}
.graph .gv.g2 circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.graph .gv.dimv circle{opacity:.45}
.graph .gv.dimv text{opacity:.5}
.graph .gv.pick circle{stroke:var(--accent);stroke-width:3;stroke-dasharray:5 4}
.mathline{font-family:var(--mono);font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--code-bg);border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.verdict{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.vrow b{font-size:.92rem}
.vrow span{font-size:.9rem;color:var(--muted)}
.vrow.yes{border-color:var(--mint);background:var(--mint-soft)}
.vrow.yes span{color:var(--text)}
@media (max-width:560px){.vrow{grid-template-columns:1fr;gap:2px}}
.mx{display:grid;gap:4px;width:max-content;font-family:var(--mono)}
.mx .h{display:grid;place-items:center;width:40px;height:34px;font-weight:700;color:var(--accent);font-size:.9rem}
.mx button{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-family:var(--mono);font-weight:700;color:var(--muted);transition:background .2s,border-color .2s,transform .15s}
.mx button:hover{border-color:var(--accent);transform:translateY(-1px)}
.mx button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mx button.diag{border-style:dashed}
.adjlist{font-family:var(--mono);font-size:.86rem;display:grid;gap:6px}
.adjlist div{padding:7px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.adjlist b{color:var(--t-var)}

/* ---------- Unidad V: tablas hash ---------- */
.htab{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:stretch}
.hidx{display:grid;place-items:center;font-family:var(--mono);font-weight:700;border-radius:9px;background:var(--accent-soft);color:var(--text);font-size:.9rem;transition:background .25s,color .25s}
.hslot{min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;border-radius:9px;border:1.5px dashed var(--line-strong);background:var(--surface);transition:border-color .25s,background .25s;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.hslot.full{border-style:solid}
.hrow.cur .hslot{border-color:var(--amber);background:var(--amber-soft);border-style:solid}
.hrow.cur .hidx{background:var(--amber);color:#fff}
.hrow.found .hslot{border-color:var(--mint);background:var(--mint-soft);border-style:solid}
.hrow.found .hidx{background:var(--mint);color:#fff}
.hrow.err .hslot{border-color:var(--coral);background:var(--coral-soft);border-style:solid;animation:shake .4s}
.kv{display:inline-flex;align-items:stretch;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface-2);color:var(--text);transition:border-color .25s,background .25s,transform .25s}
.kv b{padding:5px 8px;font-weight:700}
.kv span{padding:5px 8px;border-left:1.5px solid var(--line-strong);color:var(--muted)}
.kv.cur{border-color:var(--amber);background:var(--amber-soft);transform:translateY(-2px)}
.kv.found{border-color:var(--mint);background:var(--mint-soft);transform:translateY(-2px)}
.kv.new{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both;border-color:var(--accent);background:var(--accent-soft)}
.kv.tomb{border-style:dashed;color:var(--muted);background:transparent}
.kv.tomb b{font-weight:500;font-style:italic}
.chainar{color:var(--accent);font-weight:700}
.hcalc{font-family:var(--mono);font-size:.88rem;line-height:1.7;padding:10px 12px;border-radius:10px;background:var(--code-bg);border:1px solid var(--line);overflow-x:auto;min-height:46px}
.hcalc .r{color:var(--t-num);font-weight:700}
.ccell{display:inline-grid;justify-items:center;gap:2px;margin:0 3px 4px 0;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-family:var(--mono);min-width:38px;animation:rise .3s both}
.ccell b{font-size:1.05rem}
.ccell small{font-size:.72rem;color:var(--muted)}
.dist{display:flex;align-items:flex-end;gap:6px;height:170px;padding:4px 2px 0;border-bottom:2px solid var(--line-strong)}
.dcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0;height:100%}
.dcol i{display:block;width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--accent);transition:height .45s cubic-bezier(.2,.8,.2,1),background .25s}
.dcol i.bad{background:var(--coral)}
.dcol em{font-style:normal;font-family:var(--mono);font-size:.75rem;color:var(--text);font-weight:600}
.dlabels{display:flex;gap:6px;padding:4px 2px 0}
.dlabels span{flex:1;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--muted);min-width:0}
.pickers{display:flex;flex-wrap:wrap;gap:6px}
.pickers .chip{padding:6px 10px;font-size:.85rem}
.pickers .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.cells.lst .cell{width:auto;min-width:62px;padding:0 8px;font-size:.8rem}
.hmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px 6px;margin-bottom:12px}
.hmini .cell{width:auto;height:auto;min-height:52px;padding:6px 4px;font-size:.78rem;display:flex;flex-direction:column;justify-content:center;gap:2px;margin-bottom:12px}
.hmini .cell span{display:block;line-height:1.2}

.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin:0 0 .5em}
.gcard{display:flex;flex-direction:column;padding:14px 16px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.gcard h3{margin:10px 0 4px;font-size:1.08rem;letter-spacing:-.01em}
.gcard p{margin:0;color:var(--muted);font-size:.95rem}
.gcard p b{color:var(--text)}
.gfig{display:flex;gap:8px;justify-content:center;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.gfig figure{margin:0;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.gfig .graph{max-height:160px}
.gfig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px;line-height:1.35}
.gmore{align-self:flex-start;margin-top:auto;padding:10px 0 0;border:0;background:none;color:var(--accent);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:4px}
.gmore:hover{text-decoration:underline}
.figrow{margin:0 0 1em;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.figrow h3{margin:0 0 10px;font-size:1.1rem}
.figrow p{margin:10px 0 0;color:var(--muted)}
.figrow p b{color:var(--text)}
.figrow .gfig{flex-wrap:wrap}
.figrow .gfig figure{flex:1 1 200px}
.group .gfig{margin-bottom:12px}
.group .gfig figcaption{font-family:var(--mono);font-size:.76rem}
</style>

<script>
/* ============ Utilidades para los ejemplos ============ */
const P = String.raw;
const clean = (s, d='') => { const r = String(s ?? '').replace(/["'\\$`{}<>]/g, '').trim().slice(0, 40); return r || d; };
const FE = (cls, msg) => `Fatal error: Uncaught ${cls}: ${msg}`;
const ENC = new TextEncoder();
/* Suma de bytes de la clave: es exactamente lo que hace PHP con ord() y strlen() */
const hsum = k => [...ENC.encode(k)].reduce((a, b) => a + b, 0);
const hidx = (k, n) => hsum(k) % n;
/* Lee aristas escritas como "A-B, B-C" */
const parseEdges = s => String(s).split(',').map(t => t.trim()).filter(Boolean).map(t => t.split(/\s*-\s*/)).filter(p => p.length === 2)
  .map(([a, b]) => [clean(a).replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ]/g, '').slice(0, 10), clean(b).replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ]/g, '').slice(0, 10)]).filter(([a, b]) => a && b).slice(0, 14);
const parseKeys = s => [...new Set(String(s).split(',').map(t => clean(t).replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ ]/g, '').trim().slice(0, 14)).filter(Boolean))].slice(0, 12);

/* ============ Contenido ============ */
const MODULES = [

{ title:'¿Qué es un grafo?', unit:'Unidad V', part:'Parte I', slides:[
 {type:'cover', title:'El TAD Grafo', file:'grafo.php', sub:'Una estructura para representar relaciones: quién es amigo de quién, qué computadora está conectada con cuál, qué calle te lleva a qué esquina.', topics:['¿Qué es un grafo?','Partes principales de un grafo','Caminos','Grado de un vértice']},
 {type:'concept', title:'¿Qué es un grafo?', file:'que_es.php',
  lead:'Un <b>grafo</b> es una estructura matemática que se usa para representar <b>relaciones entre objetos</b>. Tiene solo dos ingredientes: un conjunto de <b>vértices</b> (los objetos) y un conjunto de <b>aristas</b> (las conexiones que unen esos vértices).',
  points:[['Vértices (o nodos):','son los objetos que queremos relacionar: personas, ciudades, computadoras, estaciones.'],['Aristas (o conexiones):','son las líneas que unen dos vértices e indican que están relacionados.'],['Se escribe','<code>G = (V, A)</code>: un grafo <code>G</code> es el par formado por el conjunto de vértices <code>V</code> y el conjunto de aristas <code>A</code>.'],['Se usa en','matemáticas, ciencias de la computación, redes sociales, biología... en cualquier lugar donde haya <b>cosas relacionadas entre sí</b>.']],
  analogy:'Un <b>mapa del subte</b>: cada estación es un vértice y cada tramo de vía entre dos estaciones es una arista. Al mapa no le importa la forma exacta de las calles ni las distancias reales: solo le importa <b>qué está conectado con qué</b>. Eso es exactamente lo que guarda un grafo.',
  note:'<b>¿Y el árbol de la Unidad IV?</b> Un árbol es un <b>caso particular</b> de grafo: tiene una raíz, cada nodo tiene un solo padre y no hay ciclos. En un grafo general <b>no hay raíz ni jerarquía</b>: cualquier vértice se puede conectar con cualquier otro, y puede haber caminos que vuelven al punto de partida.'},
 {type:'demo', demo:'red', title:'Una red de amigos', file:'red_social.php',

 {type:'gallery', title:'Partes principales de un grafo', file:'partes.php',

    figs:[{G:{w:300,h:212,V:{A:[110,30],B:[45,80],C:[175,80],D:[110,120],E:[55,165],F:[165,165],G:[260,80]},E:[['A','B'],['A','C'],['A','D'],['B','D'],['C','D'],['D','E'],['D','F']]}, o:{cls:{D:'sel',G:'dimv',E:'found'},ecls:{2:'hl',3:'hl',4:'hl',5:'hl',6:'hl',0:'dim',1:'dim'},sub:{D:'grado 5',E:'grado 1',G:'grado 0'}}, cap:'D tiene grado 5 (impar). E es terminal (grado 1). G está aislado (grado 0).'}]}]},
 {type:'concept', title:'Vértices y aristas', file:'vertices_aristas.php',
  lead:'Los <b>vértices</b> son los puntos o entidades del grafo. Se dibujan como un círculo o un punto y se les pone un nombre o <b>etiqueta</b> (un número o una letra). Las <b>aristas</b> son las líneas que los conectan.',

    {G:{w:250,h:120,V:{A:[45,60],B:[105,60],C:[165,60],D:[225,60]},E:[]}, o:{cls:{A:'path',B:'path',C:'path',D:'path'}}, cap:'Etiquetados con <b>letras</b>: A, B, C, D.'},

    {G:{w:270,h:140,V:{R:[50,50],C:[135,50],S:[220,50]},E:[['R','C'],['R','S']]}, o:{cls:{R:'path',C:'path',S:'path'},sub:{R:'Resistencia',C:'Corrientes',S:'Sáenz Peña'}}, cap:'Cada vértice <b>representa algo</b>: acá, ciudades unidas por rutas.'}],

 {type:'demo', demo:'direccion', title:'Con flechas o sin flechas', file:'direccion.php',

 {type:'concept', title:'Adyacentes, paralelas y lazos', file:'relaciones.php',

 {type:'demo', demo:'elementos', title:'Tocá una arista', file:'aristas_demo.php',

  points:[['Vértices conectados:','dos vértices están conectados si existe <b>al menos un camino</b> entre ellos.'],['Longitud:','es la cantidad de <b>aristas</b> que recorre el camino. <code>D → C → B → F</code> tiene longitud 3.'],['Camino simple:','no repite aristas.'],['Camino con ciclos:','vuelve a pasar por un vértice por el que ya pasó. Si termina donde empezó, es un camino cerrado.']],
  analogy:'Cuando el GPS te arma un recorrido, te está dando un <b>camino</b>: una lista de esquinas, cada una unida con la siguiente por una cuadra. Entre dos lugares puede haber muchísimos caminos; el GPS busca el <b>más corto</b>.'},
 {type:'demo', demo:'caminos', title:'Armá un camino', file:'caminos_demo.php',
  lead:'Es el grafo del apunte. Tocá vértices uno por uno para armar un camino: solo podés pasar a un vértice que esté <b>conectado</b> con el último que elegiste. Después probá el buscador del camino más corto.'},
 {type:'concept', title:'Grado de un vértice', file:'grado.php',
  lead:'El <b>grado</b> de un vértice es la <b>cantidad de aristas que inciden en él</b>: indica cuántas conexiones tiene con otros vértices.',
  points:[['Grado par:','si la cantidad de aristas es par (0, 2, 4...).'],['Grado impar:','si la cantidad de aristas es impar (1, 3, 5...).'],['Vértice aislado:','tiene grado <b>0</b>. No está conectado con nadie.'],['Vértice terminal:','tiene grado <b>1</b>. Es el final de una rama.'],['En un grafo dirigido','se distingue el <b>grado de entrada</b> (flechas que llegan) del <b>grado de salida</b> (flechas que salen).']],
  note:'<b>Una regla que siempre se cumple:</b> si sumás los grados de todos los vértices, te da <b>el doble de la cantidad de aristas</b>. ¿Por qué? Porque cada arista toca dos vértices, entonces se cuenta dos veces: una en cada extremo. En el ejemplo del apunte: 3 + 2 + 2 + 5 + 1 + 1 = 14, y el grafo tiene 7 aristas. (Por la misma razón, un lazo suma 2 al grado de su vértice: sale de él y llega a él.)'},
 {type:'demo', demo:'grado', title:'Calculá los grados', file:'grado_demo.php',
  lead:'Es el grafo del apunte. Tocá cada vértice para ver su grado y cómo se clasifica. Después tocá «Calcular todos» y comprobá la regla de la suma.'},
 {type:'quiz', title:'Cuestionario: partes de un grafo', file:'quiz_partes.php', questions:[
  {q:'¿Qué dos conjuntos forman un grafo?',o:['Raíces y hojas','Vértices y aristas','Claves y valores','Filas y columnas'],a:1,why:'Un grafo es G = (V, A): los vértices son los objetos y las aristas son las conexiones entre ellos.'},
  {q:'Una arista que conecta un vértice consigo mismo se llama...',o:['Arista paralela','Lazo','Camino','Arista adyacente'],a:1,why:'El lazo sale de un vértice y vuelve al mismo vértice.'},
  {q:'Dos aristas que comparten un vértice son...',o:['Paralelas','Lazos','Adyacentes','Dirigidas'],a:2,why:'Adyacentes: convergen en un mismo vértice. Paralelas sería si unieran el mismo par de vértices.'},
  {q:'Un vértice que no tiene ninguna arista se llama...',o:['Terminal','Aislado','Impar','Completo'],a:1,why:'Grado 0: está aislado. El terminal tiene grado 1.'},
  {q:'Un grafo no dirigido tiene 5 aristas. ¿Cuánto suman los grados de todos sus vértices?',o:['5','10','25','Depende de cuántos vértices tenga'],a:1,why:'Cada arista suma 1 al grado de cada uno de sus dos extremos: 2 × 5 = 10. No importa cuántos vértices haya.'},
  {q:'La arista dirigida (A, B)...',o:['Permite ir de A a B y de B a A','Va de A hacia B','Va de B hacia A','Es un lazo'],a:1,why:'En un par ordenado (a, b), a es el vértice inicial y b el final: la flecha va de A hacia B.'}]}
]},

{ title:'Tipos de grafos y cómo programarlos', unit:'Unidad V', part:'Parte I', slides:[
 {type:'cover', title:'Tipos de grafos', file:'tipos.php', sub:'Según cómo son sus aristas, un grafo recibe un nombre distinto. Al final, cómo guardar un grafo en un programa PHP y para qué se usan en la vida real.', topics:['Tipos de grafos','Armá tu propio grafo','Un grafo en PHP','Aplicaciones de los grafos']},
 {type:'concept', title:'Tipos de grafos', file:'tipos_lista.php',
  lead:'Existen varios tipos de grafos, cada uno con características específicas. Estos son los cinco del apunte:',
  groups:[{h:'Grafo dirigido (dígrafo)',p:'Las aristas tienen un <b>sentido definido</b>: cada arista conecta dos vértices de manera <b>unidireccional</b>.'},
          {h:'Grafo no dirigido',p:'Las aristas representan relaciones <b>simétricas</b>, sin sentido: si hay conexión entre dos vértices, se puede recorrer en <b>ambas direcciones</b>.'},
          {h:'Grafo completo',p:'<b>Cada par de vértices</b> está conectado por una arista. Con <i>n</i> vértices tiene el número máximo de conexiones: <code>n·(n−1)/2</code> aristas.'},
          {h:'Grafo bipartito',p:'Los vértices se pueden dividir en <b>dos conjuntos disjuntos</b> (sin elementos en común), de forma que <b>toda</b> arista une un vértice de un conjunto con uno del otro. Nunca hay aristas dentro del mismo conjunto.'},
          {h:'Multigrafo',p:'Permite <b>varias aristas entre el mismo par</b> de vértices (y, como en el ejemplo del apunte, también lazos). Representa relaciones más complejas que un <b>grafo simple</b>, donde solo hay una arista por par.'}],
  note:'<b>Los tipos se combinan.</b> Cada nombre responde a una pregunta distinta sobre el grafo, así que un mismo grafo puede tener varios: por ejemplo, ser <b>dirigido y multigrafo</b> a la vez, o <b>no dirigido y completo</b>.'},
 {type:'table', title:'Una pregunta para cada tipo', file:'tipos_tabla.php', lead:'Para clasificar un grafo, hacete estas preguntas. Cada una tiene un ejemplo de la vida real.',
  head:['Tipo','La pregunta que hay que hacerse','Ejemplo de la vida real'],
  rows:[['Dirigido','¿Las aristas tienen sentido (son flechas)?','Seguidores en Instagram; calles de una sola mano.'],
        ['No dirigido','¿Cada relación vale para los dos lados?','Amistades en Facebook; rutas de doble mano.'],
        ['Completo','¿Cada vértice está conectado con <b>todos</b> los demás?','Un torneo «todos contra todos»: cada equipo juega con cada uno de los otros.'],
        ['Bipartito','¿Puedo separar los vértices en dos grupos, sin aristas dentro de un mismo grupo?','Alumnos y materias: un alumno se inscribe en materias, pero nunca «se inscribe» en otro alumno.'],
        ['Multigrafo','¿Hay más de una arista entre el mismo par, o lazos?','Varios vuelos distintos en el día entre Resistencia y Buenos Aires.']]},
 {type:'demo', demo:'completo', title:'El grafo completo crece rápido', file:'completo.php',
  lead:'Mové el control para cambiar la cantidad de vértices y mirá cuántas aristas hacen falta para que <b>todos estén conectados con todos</b>. La fórmula se arma sola, paso a paso.'},
 {type:'steps', title:'¿Cómo me doy cuenta si es bipartito?', file:'bipartito.php', lead:'Mirar el dibujo no alcanza: hay grafos bipartitos que no lo parecen. Este método de <b>pintar con dos colores</b> funciona siempre.',
  steps:[{t:'Pintar un vértice',d:'Elegí cualquier vértice y pintalo de <b>naranja</b>.'},
   {t:'Pintar sus vecinos',d:'Todos los vértices conectados con él van del <b>otro</b> color: <b>azul</b>.'},
   {t:'Seguir alternando',d:'Los vecinos de los azules van naranja, los vecinos de esos van azul... hasta pintar todo.'},
   {t:'Revisar las aristas',d:'Si alguna arista une dos vértices <b>del mismo color</b>, el grafo <b>no</b> es bipartito.',sub:['Si no pasa nunca, los dos colores son los dos conjuntos.','Un triángulo nunca es bipartito: el tercer vértice no tiene color posible.']}]},
 {type:'demo', demo:'constructor', title:'Armá tu propio grafo', file:'constructor.php',
  lead:'Tocá un vértice y después otro para unirlos con una arista (tocá dos veces el mismo para hacer un lazo). Tocá una arista para borrarla. El panel te dice, en todo momento, de qué tipo es tu grafo y <b>por qué</b>. En la fila «Bipartito», tocá «Mostrar en el dibujo» para ver los dos grupos pintados.'},
 {type:'concept', title:'Cómo se guarda un grafo en un programa', file:'representacion.php',
  lead:'En el apunte dibujamos los grafos con círculos y líneas, pero la computadora necesita guardarlos en una <b>estructura de datos</b>. Hay dos formas clásicas de hacerlo:',
  groups:[{h:'Matriz de adyacencia',p:'Una tabla de <i>n</i> × <i>n</i> (un array de arrays). En la fila A, columna B, va un <b>1</b> si hay arista de A a B, y un <b>0</b> si no. En un grafo no dirigido la tabla es <b>simétrica</b>: lo de arriba de la diagonal es un espejo de lo de abajo.'},
          {h:'Lista de adyacencia',p:'Para cada vértice, una <b>lista con sus vecinos</b>. En PHP es un array asociativo: <code>["A" => ["B", "C"], "B" => ["A"]]</code>. Ocupa menos memoria cuando hay pocas aristas, y el grado de un vértice es simplemente el largo de su lista.'}],
  note:'<b>¿Cuál conviene?</b> Si el grafo tiene <b>muchas</b> aristas (cerca de ser completo), la matriz es cómoda y preguntar «¿hay arista entre A y B?» es inmediato. Si tiene <b>pocas</b> aristas, la lista ahorra muchísimo lugar: una matriz de 1000 vértices tiene un millón de casillas, aunque casi todas sean 0.'},
 {type:'demo', demo:'matriz', title:'Matriz y lista, lado a lado', file:'matriz_demo.php',
  lead:'Tocá las casillas de la matriz para agregar o quitar aristas. El dibujo y la lista de adyacencia se actualizan solos. Probá en modo no dirigido y fijate qué pasa con la casilla «espejo».'},
 {type:'code', title:'Un grafo en PHP', file:'Grafo.php',
  lead:'Una clase <code>Grafo</code> que usa una <b>lista de adyacencia</b>. <code>agregarArista()</code> anota la conexión; si el grafo no es dirigido, la anota <b>en los dos sentidos</b>. Cambiá las aristas o el tipo y ejecutá.',
  controls:[{k:'ar',label:'Aristas (formato A-B, separadas por comas)',type:'text',value:'A-B, A-C, A-D, B-D, C-D, D-E, D-F'},{k:'dir',label:'Grafo dirigido',type:'toggle',value:false}],
  code:v=>{ const E=parseEdges(v.ar); return P`<?php
class Grafo {
    private array $ady = [];       // lista de adyacencia: vértice => [vecinos]
    private bool $dirigido;

    public function __construct(bool $dirigido = false) {
        $this->dirigido = $dirigido;
    }

    public function agregarVertice(string $v): void {
        if (!isset($this->ady[$v])) {
            $this->ady[$v] = [];       // un vértice nuevo empieza sin vecinos
        }
    }

    public function agregarArista(string $a, string $b): void {
        $this->agregarVertice($a);
        $this->agregarVertice($b);
        $this->ady[$a][] = $b;         // a → b
        if (!$this->dirigido) {
            $this->ady[$b][] = $a;     // sin dirección: también b → a
        }
    }

    public function grado(string $v): int {
        return count($this->ady[$v] ?? []);   // largo de su lista
    }

    public function mostrar(): void {
        foreach ($this->ady as $v => $vecinos) {
            echo "$v -> [" . implode(", ", $vecinos) . "]  grado: " . $this->grado($v) . "\n";
        }
    }
}

$g = new Grafo(${v.dir ? 'true' : 'false'});
${E.map(([a, b]) => `$g->agregarArista("${a}", "${b}");`).join('\n') || '// (sin aristas)'}
$g->mostrar();`; },
  run:v=>{ const E=parseEdges(v.ar); if(!E.length) return '(no se imprime nada: el grafo no tiene vértices)';
    const ady={}; const add=x=>{ if(!ady[x]) ady[x]=[]; };
    E.forEach(([a,b])=>{ add(a); add(b); ady[a].push(b); if(!v.dir) ady[b].push(a); });
    return Object.keys(ady).map(k=>`${k} -> [${ady[k].join(', ')}]  grado: ${ady[k].length}`).join('\n'); },
  after:v=>{ const E=parseEdges(v.ar); if(!E.length) return ''; const ady={}; E.forEach(([a,b])=>{ (ady[a]=ady[a]||[]).push(b); ady[b]=ady[b]||[]; if(!v.dir) ady[b].push(a); });
    const s=Object.values(ady).reduce((t,l)=>t+l.length,0);
    return v.dir ? `<div class="note"><b>En el dirigido, <code>grado()</code> devuelve el grado de salida:</b> solo cuenta las flechas que <b>salen</b> de cada vértice. Por eso un vértice al que solo le llegan flechas muestra grado 0. La suma da ${s}, igual a la cantidad de aristas (${E.length}), porque cada flecha se anota una sola vez.</div>`
      : `<div class="note"><b>Comprobá la regla:</b> los grados suman <b>${s}</b> y hay <b>${E.length}</b> aristas: ${s} = 2 × ${E.length}. Cada arista se anotó en la lista de sus dos extremos.${E.some(([a,b])=>a===b)?' El lazo aparece dos veces en la lista de su vértice, por eso suma 2 a su grado.':''}</div>`; }},
 {type:'concept', title:'Aplicaciones de los grafos', file:'aplicaciones.php',
  lead:'Los grafos son herramientas poderosas en muchísimas áreas. En cada caso, la clave es decidir <b>qué son los vértices</b> y <b>qué son las aristas</b>.',
  groups:[{h:'Redes sociales',p:'<b>Vértices:</b> usuarios. <b>Aristas:</b> amistades (no dirigidas) o «seguir» (dirigidas). Sirve para sugerir amigos: los amigos de tus amigos.'},
          {h:'Redes informáticas',p:'<b>Vértices:</b> computadoras, routers, servidores. <b>Aristas:</b> cables o enlaces. Sirve para saber si un mensaje puede llegar de una máquina a otra y por dónde.'},
          {h:'Rutas y navegación',p:'<b>Vértices:</b> esquinas o ciudades. <b>Aristas:</b> calles o rutas, con su distancia. El GPS busca el <b>camino óptimo</b> (el más corto o el más rápido).'},
          {h:'Biología',p:'<b>Vértices:</b> especies o genes. <b>Aristas:</b> quién se alimenta de quién, o qué gen influye sobre cuál. Sirve para estudiar cómo afecta un cambio a todo el sistema.'}],
  analogy:'Siempre que te encuentres con <b>cosas</b> y <b>relaciones entre esas cosas</b>, pensá en un grafo. La primera pregunta es: ¿qué son los vértices? La segunda: ¿qué son las aristas, y tienen dirección?'},
 {type:'quiz', title:'Cuestionario: tipos de grafos', file:'quiz_tipos.php', questions:[
  {q:'En un grafo dirigido, las aristas...',o:['No tienen sentido','Tienen un sentido definido (son flechas)','Siempre forman ciclos','Conectan todos los vértices'],a:1,why:'Dirigido: cada arista conecta dos vértices en un solo sentido.'},
  {q:'¿Cuántas aristas tiene un grafo completo (simple, no dirigido) con 5 vértices?',o:['5','10','20','25'],a:1,why:'5 × 4 / 2 = 10. Cada vértice se une con los otros 4, y cada arista se contó dos veces (una por extremo).'},
  {q:'Un grafo tiene dos aristas distintas entre A y B. ¿Qué tipo de grafo es?',o:['Completo','Bipartito','Multigrafo','Simple'],a:2,why:'Las aristas paralelas solo están permitidas en los multigrafos.'},
  {q:'Un triángulo (A–B, B–C, C–A), ¿es bipartito?',o:['Sí, siempre','No: dos vértices del mismo grupo quedan unidos','Solo si es dirigido','Sí, si se le agrega un lazo'],a:1,why:'Si A va a un grupo, B y C van al otro; pero B y C están unidos. Un ciclo con cantidad impar de vértices nunca es bipartito.'},
  {q:'Alumnos que se inscriben en materias forman un grafo...',o:['Completo','Bipartito','Con lazos','Sin aristas'],a:1,why:'Dos conjuntos (alumnos y materias), y las aristas solo van de un conjunto al otro.'},
  {q:'En una lista de adyacencia, para cada vértice se guarda...',o:['Su posición en el dibujo','La lista de sus vecinos','Una tabla de n × n','Solamente su grado'],a:1,why:'Cada vértice tiene su lista de vecinos. La tabla de n × n es la matriz de adyacencia.'}]}
]},

{ title:'Tablas hash', unit:'Unidad V', part:'Parte II', slides:[
 {type:'cover', title:'Tablas hash', file:'hash.php', sub:'Cómo encontrar un dato entre miles en un solo paso: una función que convierte la clave en la posición exacta donde está guardado.', topics:['¿Qué es una tabla hash?','La función hash','Manejo de colisiones','Ventajas y desventajas']},
 {type:'concept', title:'¿Qué es una tabla hash?', file:'que_es_hash.php',
  lead:'Una <b>tabla hash</b> es una estructura de datos que implementa un tipo de dato abstracto llamado <b>diccionario</b>: asocia <b>claves</b> (o llaves) con <b>valores</b>. Su operación principal es la <b>búsqueda eficiente</b>: dada una clave, encontrar su valor rápidamente.',
  points:[['Clave:','lo que usamos para buscar. Un DNI, un número de legajo, un nombre de usuario.'],['Valor:','lo que queremos obtener. Los datos del alumno, su nota, su saldo.'],['Función hash:','transforma la clave en un número (el <b>hash</b>) que indica la <b>posición</b> de la tabla donde está guardado el valor.']],
  analogy:'El <b>guardarropa de un boliche</b>: dejás la campera y te dan un número. Cuando volvés, no revisan todas las camperas una por una: van directo a la percha con tu número. La función hash es la que «te da el número» a partir de la clave.',
  note:'<b>Ya la usaste sin saberlo:</b> los arrays asociativos de PHP, como <code>$notas["Ana"] = 9</code>, están implementados por dentro con una tabla hash. Por eso <code>$notas["Ana"]</code> responde al instante aunque el array tenga miles de elementos.'},
 {type:'concept', title:'¿Por qué es tan rápida?', file:'funcionamiento.php',
  lead:'Las tablas hash se implementan sobre <b>arreglos</b>, generalmente unidimensionales (aunque también pueden ser multidimensionales). Como la función hash nos dice <b>directamente</b> la posición, no hace falta recorrer los datos.',
  groups:[{h:'Caso promedio: O(1)',p:'Calculás la posición y vas directo. Tarda <b>lo mismo con 10 datos que con un millón</b>: el rendimiento no se ve afectado por la cantidad de elementos.'},
          {h:'Peor caso: O(n)',p:'Si muchas claves distintas caen en la misma posición (<b>colisiones</b>), hay que revisarlas una por una. En el peor caso todas caen juntas y buscar es como recorrer una lista.'}],
  note:'<b>¿Qué significan O(1) y O(n)?</b> Es la notación que usamos para medir cuánto trabajo hace un algoritmo según la cantidad de datos <i>n</i>. <b>O(1)</b> es «constante»: siempre la misma cantidad de pasos. <b>O(n)</b> es «lineal»: si se duplican los datos, se duplican los pasos.'},
 {type:'demo', demo:'comparar', title:'Lista contra tabla hash', file:'comparar.php',
  lead:'Los mismos 12 alumnos, guardados en una <b>lista</b> y en una <b>tabla hash</b> de 13 posiciones. La clave es el número de legajo. Elegí a quién buscar y contá cuántos lugares tiene que mirar cada una.'},
 {type:'steps', title:'Cómo utilizar una tabla hash: paso a paso', file:'pasos.php', lead:'El proceso completo, desde crear la tabla hasta manipular los datos. Cada paso lo vemos en detalle a continuación.',
  steps:[{t:'Definir la estructura',d:'Un arreglo donde cada posición se llama <b>bucket</b> o <b>ranura</b>.'},
   {t:'Elegir una función hash',d:'La que convierte cada clave en un índice del arreglo.'},
   {t:'Insertar un par clave-valor',d:'Calcular el índice y guardar el par en ese bucket.'},
   {t:'Buscar un valor por clave',d:'Calcular el índice con la <b>misma</b> función e ir a ese bucket.'},
   {t:'Eliminar un par clave-valor',d:'Calcular el índice, encontrar el par y sacarlo sin romper nada.'}]},
 {type:'concept', title:'La estructura: buckets', file:'estructura.php',
  lead:'Una tabla hash se implementa generalmente como un <b>arreglo</b> (array) donde cada posición se denomina <b>bucket</b> o <b>ranura</b>. Cada bucket puede contener <b>un único par clave-valor</b>, o una <b>lista de pares</b> cuando hay colisiones.',
  points:[['El tamaño','del arreglo se fija al crear la tabla. Vamos a llamarlo <code>tamaño</code>.'],['Los índices','van de <code>0</code> a <code>tamaño − 1</code>, como en cualquier arreglo.'],['Un bucket vacío','todavía no tiene ningún par guardado.']],
  analogy:'Los <b>casilleros de un gimnasio</b>, numerados del 0 al 6. Cada casillero es un bucket. Si te asignan el 4, vas directo al 4: no abrís los otros.'},
 {type:'concept', title:'La función hash', file:'funcion.php',
  lead:'La función hash es <b>crucial</b>: transforma la clave en un <b>índice</b> que determina la posición del valor en la tabla. Una buena función hash debe:',
  points:[['Ser rápida de calcular:','si tardara mucho, perderíamos la ventaja de ir directo a la posición.'],['Distribuir las claves uniformemente:','repartirlas parejo entre todos los buckets, para minimizar las colisiones.'],['Dar siempre el mismo resultado:','la misma clave tiene que dar <b>siempre</b> el mismo índice. Si no, nunca encontraríamos lo que guardamos.']],
  note:'<b>La función que usamos en los ejemplos:</b> sumamos el código de cada letra de la clave (en PHP, <code>ord()</code> da ese código: <code>ord("A")</code> es 65) y nos quedamos con el <b>resto</b> de dividir por el tamaño: <code>índice = suma % tamaño</code>. El módulo (<code>%</code>) garantiza que el resultado esté siempre entre 0 y tamaño − 1, o sea, que sea una posición válida del arreglo.'},
 {type:'demo', demo:'funcion', title:'Calculá un hash', file:'funcion_demo.php',
  lead:'Escribí una clave y mirá cómo se transforma en un índice, letra por letra. Abajo podés comparar una función hash <b>mala</b> con una <b>buena</b> repartiendo las mismas 12 claves.'},
 {type:'concept', title:'Manejo de colisiones', file:'colisiones.php',
  lead:'Una <b>colisión</b> ocurre cuando dos claves distintas dan el <b>mismo índice</b>. Las colisiones son <b>inevitables</b>, así que hay que gestionarlas para mantener la eficiencia. Las dos técnicas principales son:',
  groups:[{h:'Encadenamiento',p:'Cada posición del arreglo contiene una <b>lista enlazada</b> con todos los pares que cayeron ahí. Si hay colisión, el nuevo par se agrega a esa lista.'},
          {h:'Dirección abierta (sondeo)',p:'Si el bucket está ocupado, se buscan <b>otras posiciones disponibles</b> dentro del mismo arreglo hasta encontrar un espacio libre. La forma más simple es el <b>sondeo lineal</b>: probar el siguiente, y el siguiente... volviendo al 0 al llegar al final.'}],
  analogy:'Llegás al estacionamiento y tu lugar está ocupado. Con <b>encadenamiento</b>, estacionás en fila detrás del auto que está ahí. Con <b>sondeo lineal</b>, avanzás hasta el próximo lugar libre de la fila.',

class TablaHash {
    private array $buckets;
    private int $tamano;

    public function __construct(int $tamano) {
        $this->tamano = $tamano;
        $this->buckets = array_fill(0, $tamano, []);  // cada bucket: lista vacía
    }

    private function hash(string $clave): int {
        $suma = 0;
        for ($i = 0; $i < strlen($clave); $i++) {
            $suma += ord($clave[$i]);           // código de cada letra
        }
        return $suma % $this->tamano;           // siempre entre 0 y tamaño - 1
    }

    public function insertar(string $clave, mixed $valor): void {
        $i = $this->hash($clave);
        foreach ($this->buckets[$i] as $k => $par) {
            if ($par[0] === $clave) {           // la clave ya estaba:
                $this->buckets[$i][$k][1] = $valor;   // reemplazo el valor
                return;
            }
        }
        $this->buckets[$i][] = [$clave, $valor];      // la agrego a la lista
    }

    public function buscar(string $clave): mixed {
        $i = $this->hash($clave);
        foreach ($this->buckets[$i] as $par) {  // recorro SOLO este bucket
            if ($par[0] === $clave) {
                return $par[1];
            }
        }
        return null;                            // no está
    }

    public function eliminar(string $clave): bool {
        $i = $this->hash($clave);
        foreach ($this->buckets[$i] as $k => $par) {
            if ($par[0] === $clave) {
                array_splice($this->buckets[$i], $k, 1);  // la saco de la lista
                return true;
            }
        }
        return false;
    }

    public function mostrar(): void {
        foreach ($this->buckets as $i => $lista) {
            $claves = array_map(fn($par) => $par[0], $lista);
            echo "[$i] " . (count($claves) ? implode(" -> ", $claves) : "(vacío)") . "\n";
        }
    }
}

<script>
/* ============ Motor de la presentación ============ */
const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Resaltado de sintaxis PHP ---------- */
const KW = new Set('abstract and array as break callable case catch class clone const continue declare default do echo else elseif empty extends final finally fn for foreach function global if implements include instanceof insteadof interface isset list match namespace new or print private protected public readonly require return static switch throw trait try unset use var while yield true false null void int float string bool mixed iterable object self parent never'.split(' '));
function hl(code) {
  const re = /(<\?php)|(\/\/[^\n]*|#(?!\[)[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\$[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); const t = m[0];
    if (m[1]) out += `<span class="t-tag">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="t-str">${esc(t).replace(/\$[A-Za-z_]\w*/g, v => `<span class="t-var">${v}</span>`)}</span>`;
    else if (m[4]) out += `<span class="${t === '$this' ? 't-this' : 't-var'}">${t}</span>`;
    else if (m[5]) out += `<span class="t-num">${t}</span>`;
    else {
      const before = code.slice(Math.max(0, m.index - 2), m.index), call = /^\s*\(/.test(code.slice(re.lastIndex));
      if (before === '->' || before === '?>') out += call ? `<span class="t-fn">${t}</span>` : esc(t);
      else if (KW.has(t.toLowerCase()) && !(call && !['function','fn','array','isset','unset','empty','match','list','echo','print','declare','if','foreach','for','while','switch','catch'].includes(t))) out += `<span class="t-kw">${t}</span>`;
      else if (call) out += `<span class="t-fn">${t}</span>`;
      else if (/^[A-Z]/.test(t)) out += `<span class="t-cls">${t}</span>`;
      else out += esc(t);
    }
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ---- Dibujo de grafos en SVG ----
   G = { V: {id: [x, y]}, E: [[a, b], ...], dir: bool, w, h }

  const loopsAt = {};
  const arrow = (ex, ey, ux, uy, cls) => { const bx = ex - ux * 11, by = ey - uy * 11, nx = -uy, ny = ux;
    return `<polygon class="ah" points="${ex.toFixed(1)},${ey.toFixed(1)} ${(bx + nx * 5.5).toFixed(1)},${(by + ny * 5.5).toFixed(1)} ${(bx - nx * 5.5).toFixed(1)},${(by - ny * 5.5).toFixed(1)}"/>`; };

    if (a === b) {
      const [x, y] = P0[a], m = loopsAt[a] = (loopsAt[a] || 0) + 1, s = 1 + (m - 1) * .45;
      const d = `M${x - 9} ${y - R + 3} C${x - 32 * s} ${y - R - 44 * s} ${x + 32 * s} ${y - R - 44 * s} ${x + 9} ${y - R + 3}`;
      let ah = ''; if (G.dir) { const ux = 9 - 32 * s, uy = (-R + 3) - (-R - 44 * s), L = Math.hypot(ux, uy); ah = arrow(x + 9, y - R + 3, ux / L, uy / L); }

    const [lo, hi] = a < b ? [a, b] : [b, a], [x1, y1] = P0[lo], [x2, y2] = P0[hi];
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L, ny = (x2 - x1) / L;

    const d = off ? `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}` : `M${sx.toFixed(1)} ${sy.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}`;
    let ah = ''; if (G.dir) { const ux = ex - cx, uy = ey - cy, l = Math.hypot(ux, uy) || 1; ah = arrow(ex, ey, ux / l, uy / l); }
    edges += `<g class="ge ${cls}" data-k="${k}"><path class="hit" d="${d}"/><path class="ln2" d="${d}"/>${ah}</g>`;

        <div class="ctrl"><span>Tipo de aristas</span><div class="seg"><button data-d="0" aria-pressed="true">no dirigido</button><button data-d="1" aria-pressed="false">dirigido</button></div></div>

      <div class="two"><div class="panel"><div class="gr"></div><div class="bipleg"></div><div class="status" style="margin-top:6px"></div><div class="qnav" style="margin-top:10px"><button class="btn ghost sm undo">Deshacer</button><button class="btn ghost sm clr">${ICON.redo}Vaciar</button></div></div>

      const simple = !c.loops.length && !c.pars.length, comp = !c.missing.length && simple;
      const g1 = ids().filter(v => c.color[v] === 1), g2 = ids().filter(v => c.color[v] === 2);
