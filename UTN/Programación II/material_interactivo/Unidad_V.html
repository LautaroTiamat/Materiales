        st.innerHTML = b.length > 1 ? `<b>¡Colisión!</b> El bucket ${i} ya tenía datos, así que «${esc(k)}» se <b>encadenó</b> al final de su lista.` : `<b>Listo:</b> «${esc(k)}» quedó en el bucket ${i}.`; logLine(log, `// guardado en [${i}]${b.length > 1 ? ' (colisión: encadenado)' : ''}`, 'dim'); return; }
      let free = -1, steps = 0;
      for (let t = 0; t < N; t++) { const j = (i + t) % N, b = T[j]; steps++; draw({ [j]: 'cur' }, { [j + ':0']: 'cur' });
        if (!b) { st.innerHTML = `Bucket <b>${j}</b>: vacío.${free >= 0 ? '' : ' Acá va.'}`; if (free < 0) free = j; await sleep(650); if (!alive()) return; break; }
        if (b.tomb) { st.innerHTML = `Bucket <b>${j}</b>: tiene una lápida. Lo anoto como lugar libre, pero sigo mirando por si la clave ya está más adelante.`; if (free < 0) free = j; await sleep(900); if (!alive()) return; continue; }
        if (b.k === k) { b.v = v; draw({ [j]: 'found' }, { [j + ':0']: 'found' }); st.innerHTML = `<b>«${esc(k)}» ya estaba</b> en el bucket ${j}: reemplacé su valor.`; logLine(log, '// clave repetida: valor reemplazado', 'dim'); return; }
        st.innerHTML = `Bucket <b>${j}</b>: ocupado por «${esc(b.k)}». ${t === 0 ? '<b>¡Colisión!</b> ' : ''}Pruebo el siguiente${j === N - 1 ? ' (vuelvo al 0)' : ''}.`; await sleep(800); if (!alive()) return; }
      if (free < 0) { draw(Object.fromEntries(T.map((_, j) => [j, 'err']))); st.innerHTML = '<b>La tabla está llena.</b> Con sondeo lineal, cada bucket guarda un solo par: no entra nada más.'; logLine(log, '// error: tabla llena', 'e'); return; }
      T[free] = { k, v }; draw({ [free]: 'found' }, { [free + ':0']: 'new' }); st.innerHTML = free === i ? `<b>Listo:</b> «${esc(k)}» quedó en el bucket ${i}.` : `<b>Listo:</b> «${esc(k)}» debía ir al ${i}, pero quedó en el <b>${free}</b>, ${(free - i + N) % N} lugar${(free - i + N) % N > 1 ? 'es' : ''} más adelante.`;
      logLine(log, `// guardado en [${free}]${free !== i ? ` (colisión: sondeo desde [${i}])` : ''}`, 'dim'); });
    const bus = guard(async (k, v, alive) => { logLine(log, `echo $t->buscar("${k}");`, 'c'); const i = showCalc(k); let cmp = 0;
      if (mode === 'encadenamiento') { const b = T[i]; draw({ [i]: 'cur' }); st.innerHTML = `Voy directo al bucket <b>${i}</b>.`; await sleep(700); if (!alive()) return;
        for (let j = 0; j < b.length; j++) { cmp++; draw({ [i]: 'cur' }, { [i + ':' + j]: 'cur' }); st.innerHTML = `¿«${esc(b[j].k)}» es «${esc(k)}»? ${b[j].k === k ? '<b>¡Sí!</b>' : 'No, sigo por la lista.'}`; await sleep(700); if (!alive()) return;
          if (b[j].k === k) { draw({ [i]: 'found' }, { [i + ':' + j]: 'found' }); st.innerHTML = `<b>Encontrado:</b> la nota de «${esc(k)}» es <b>${esc(b[j].v)}</b>. Hice ${cmp} comparaci${cmp > 1 ? 'ones' : 'ón'}.`; logLine(log, b[j].v); return; } }
        draw({ [i]: 'err' }); st.innerHTML = `<b>«${esc(k)}» no está.</b> ${b.length ? `Revisé las ${b.length} clave${b.length > 1 ? 's' : ''} del bucket ${i} y ninguna coincide.` : `El bucket ${i} está vacío.`} No hizo falta mirar los otros buckets.`; logLine(log, 'null  // no está', 'dim'); return; }
      for (let t = 0; t < N; t++) { const j = (i + t) % N, b = T[j]; draw({ [j]: 'cur' }, { [j + ':0']: 'cur' });
        if (!b) { draw({ [j]: 'err' }); st.innerHTML = `Bucket <b>${j}</b> vacío: <b>«${esc(k)}» no está.</b> Si estuviera, habría quedado antes de este hueco.`; logLine(log, 'null  // no está', 'dim'); return; }
        if (b.tomb) { st.innerHTML = `Bucket <b>${j}</b>: <b>lápida</b>. Acá hubo algo que se borró: <b>no me detengo</b>, sigo buscando.`; await sleep(1000); if (!alive()) return; continue; }
        cmp++; st.innerHTML = `Bucket <b>${j}</b>: ¿«${esc(b.k)}» es «${esc(k)}»? ${b.k === k ? '<b>¡Sí!</b>' : 'No, pruebo el siguiente.'}`; await sleep(750); if (!alive()) return;
        if (b.k === k) { draw({ [j]: 'found' }, { [j + ':0']: 'found' }); st.innerHTML = `<b>Encontrado</b> en el bucket ${j}: la nota de «${esc(k)}» es <b>${esc(b.v)}</b>.${j !== i ? ` Tuve que avanzar desde el ${i} porque hubo colisiones.` : ''}`; logLine(log, b.v); return; } }
      st.innerHTML = `Recorrí toda la tabla: <b>«${esc(k)}» no está.</b>`; logLine(log, 'null  // no está', 'dim'); });
    const eli = guard(async (k, v, alive) => { logLine(log, `$t->eliminar("${k}");`, 'c'); const i = showCalc(k);
      if (mode === 'encadenamiento') { const b = T[i]; draw({ [i]: 'cur' }); await sleep(600); if (!alive()) return;
        for (let j = 0; j < b.length; j++) { draw({ [i]: 'cur' }, { [i + ':' + j]: 'cur' }); st.innerHTML = `¿«${esc(b[j].k)}» es «${esc(k)}»? ${b[j].k === k ? '<b>Sí.</b>' : 'No.'}`; await sleep(650); if (!alive()) return;
          if (b[j].k === k) { b.splice(j, 1); draw({ [i]: 'found' }); st.innerHTML = `<b>Eliminé «${esc(k)}».</b> ${b.length ? 'Los demás pares de la lista se reengancharon: la lista sigue entera.' : `El bucket ${i} quedó vacío.`}`; logLine(log, '// eliminado', 'dim'); return; } }
        draw({ [i]: 'err' }); st.innerHTML = `<b>«${esc(k)}» no está</b>: no hay nada para eliminar.`; logLine(log, '// no estaba', 'dim'); return; }
      for (let t = 0; t < N; t++) { const j = (i + t) % N, b = T[j]; draw({ [j]: 'cur' }, { [j + ':0']: 'cur' }); await sleep(650); if (!alive()) return;
        if (!b) break; if (b.tomb || b.k !== k) { st.innerHTML = `Bucket ${j}: no es «${esc(k)}», sigo.`; continue; }
        T[j] = { tomb: true }; draw({ [j]: 'found' }, { [j + ':0']: 'new' });
        st.innerHTML = `<b>Eliminé «${esc(k)}» del bucket ${j}</b> y dejé una <b>lápida</b> en su lugar. Si lo dejara vacío, una búsqueda que pase por acá se detendría y no encontraría claves que se corrieron más adelante.`; logLine(log, `// eliminado: lápida en [${j}]`, 'dim'); return; }
      draw(); st.innerHTML = `<b>«${esc(k)}» no está</b>: no hay nada para eliminar.`; logLine(log, '// no estaba', 'dim'); });
    $('.ins', box).onclick = ins; $('.bus', box).onclick = bus; $('.eli', box).onclick = eli;
    $('.k', box).addEventListener('keydown', e => { if (e.key === 'Enter') ins(); });
    $('.ej', box).onclick = () => { reset(); EX.forEach(([k, v]) => { quickInsert(k, v); logLine(log, `$t->insertar("${k}", ${v});`, 'c'); }); draw();
      st.innerHTML = mode === 'encadenamiento' ? 'Cargué 6 alumnos. Fijate los buckets <b>1</b> y <b>6</b>: hubo colisiones y se formaron listas.' : 'Cargué 6 alumnos. «Juan» debía ir al 6 (ocupado por Ana), dio la vuelta y quedó en el <b>2</b>. «Leo» debía ir al 1 y quedó en el <b>3</b>.';
      $('.hcalc', box).innerHTML = 'Ana → 6 · Luis → 0 · Sol → 1 · Juan → 6 · Eva → 4 · Leo → 1'; };
    $('.vac', box).onclick = reset;
    $$('[data-m]', box).forEach(b => b.onclick = () => { if (busy) return; const old = mode === 'encadenamiento' ? T.flat() : T.filter(x => x && !x.tomb); mode = b.dataset.m; $$('[data-m]', box).forEach(x => x.setAttribute('aria-pressed', x === b)); reset(); old.forEach(p => quickInsert(p.k, p.v)); draw();
      if (old.length) { logLine(log, `// se reinsertaron ${old.length} claves con ${mode}`, 'dim'); st.innerHTML = `Rearmé la tabla con <b>${mode}</b>, con las mismas claves. Compará dónde quedó cada una.`; } });
    reset();
  },
};

/* ---------- Navegación ---------- */
const wrap = $('#wrap');
function go(i, dir) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i)); if (i === cur) return;
  dir = dir ?? (i > cur ? 1 : -1); NAV++;
  const s = SLIDES[i], m = MODULES[s.mi];
  const old = $('.slide:not(.leave)', wrap);
  if (old) { old.style.setProperty('--dir', dir); old.classList.add('leave'); setTimeout(() => old.remove(), 230); }
  const el = document.createElement('section'); el.className = 'slide enter'; el.style.setProperty('--dir', dir);
  el.setAttribute('aria-label', s.title); el.innerHTML = R[s.type](s); wrap.appendChild(el);
  H[s.type]?.(el, s);
  $$('[data-go="next"]', el).forEach(b => b.onclick = () => go(cur + 1));
  cur = i;
  $('#tabName').textContent = s.file || 'slide.php';
  $('#crumb').textContent = `${m.unit}, ${m.part.replace('Parte','parte')}`;
  $('#modName').textContent = `${s.mi + 1}. ${m.title}`;
  $('#pos').innerHTML = `<b>${i + 1}</b> de ${SLIDES.length}`;
  $('#bar').style.width = ((i + 1) / SLIDES.length * 100) + '%';
  $('#prev').disabled = i === 0; $('#next').disabled = i === SLIDES.length - 1;
  store.set('pos', i);
  try { history.replaceState(null, '', '#' + (i + 1)); } catch {}
  markDrawer();
}

/* ---------- Índice lateral ---------- */
function buildDrawer() {
  const open = new Set($$('.dmod.open').map(d => +d.dataset.mi)); if (!open.size && cur >= 0) open.add(SLIDES[cur].mi);
  $('#dlist').innerHTML = MODULES.map((m, mi) => {
    const qs = QUIZZES.filter(q => q.mi === mi), t = qs.reduce((a, q) => a + q.questions.length, 0), c = qs.reduce((a, q) => a + (scores[q.qid]?.c || 0), 0);
    return `<div class="dmod ${open.has(mi) ? 'open' : ''}" data-mi="${mi}"><button aria-expanded="${open.has(mi)}"><span class="num">${mi + 1}</span><span class="mt"><b>${m.title}</b><span>${m.unit}, ${m.part.replace('Parte','parte')}: ${c}/${t} correctas</span></span>${ICON.chev}</button>
      <ul class="dslides">${m.slides.map(s => `<li><button data-i="${s.idx}">${s.type === 'quiz' ? 'Cuestionario' : s.type === 'cover' ? 'Portada' : s.title}${s.type === 'quiz' ? `<span class="qb ${scores[s.qid] ? 'done' : ''}">${scores[s.qid] ? scores[s.qid].c + '/' + scores[s.qid].t : s.questions.length + ' preg.'}</span>` : ''}</button></li>`).join('')}</ul></div>`;
  }).join('');
  $$('.dmod>button').forEach(b => b.onclick = () => { const d = b.parentElement; d.classList.toggle('open'); b.setAttribute('aria-expanded', d.classList.contains('open')); });
  $$('.dslides button').forEach(b => b.onclick = () => { go(+b.dataset.i); drawer(false); });
  markDrawer();
}
function markDrawer() { $$('.dslides button').forEach(b => b.classList.toggle('cur', +b.dataset.i === cur)); }
function drawer(on) { $('#drawer').classList.toggle('on', on); $('#backdrop').classList.toggle('on', on); $('#menuBtn').setAttribute('aria-expanded', on);
  if (on) { const s = SLIDES[cur]; const d = $(`.dmod[data-mi="${s.mi}"]`); if (d && !d.classList.contains('open')) d.firstElementChild.click(); setTimeout(() => $('.dslides button.cur')?.scrollIntoView({ block: 'center' }), 50); } }
function updateScore() { const c = Object.values(scores).reduce((a, x) => a + x.c, 0); $('#scoreTxt').textContent = `${c}/${TOTALQ}`; }

/* ---------- Tema ---------- */
const root = document.documentElement;
function setTheme(t) { root.setAttribute('data-theme', t); store.set('theme', t); }
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* ---------- Eventos globales ---------- */
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
$('#menuBtn').onclick = () => drawer(true);
$('#closeDrawer').onclick = $('#backdrop').onclick = () => drawer(false);
$('#scoreBtn').onclick = () => go(SLIDES.length - 1);
if (!document.fullscreenEnabled) $('#fsBtn').style.display = 'none';
$('#fsBtn').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen(); } catch {} };
document.addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') return drawer(false);
  if ($('#drawer').classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SLIDES.length - 1);
  else if (SLIDES[cur].type === 'quiz' && /^[a-dA-D1-4]$/.test(e.key)) { const j = isNaN(e.key) ? 'abcd'.indexOf(e.key.toLowerCase()) : +e.key - 1; $$('.slide:not(.leave) .opt:not([disabled])')[j]?.click(); }
});
let tx = null, ty = 0;
$('#stage').addEventListener('touchstart', e => { tx = e.target.closest('.code,.twrap,input,.bars,.cells,.log,.chart,.flip,.ll,.que,.stk,.graph,.htab,.mx,.dist,.pickers') ? null : e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#stage').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; }, { passive: true });

/* ---------- Inicio ---------- */
const fromHash = parseInt(location.hash.slice(1), 10);
updateScore(); buildDrawer();
go(!isNaN(fromHash) ? fromHash - 1 : store.get('pos', 0), 1);
</script>
